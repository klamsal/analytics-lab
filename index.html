<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Analytics Lab — Decision Modeling Tools</title>
    <style>
      :root{
        --bg:#f7f4ee; --bg2:#efe9dd; --surface:#fffdf8; --surface2:#f3eee2;
        --ink:#1d2733; --ink2:#46536a; --ink3:#6b7790;
        --line:#ddd3bf; --line2:#c9bda1;
        --accent:#0e6b5c; --accent-ink:#0a5547; --accent-soft:#dcefe9;
        --amber:#b45309; --amber-soft:#fbeed3;
        --red:#b3261e; --red-soft:#fbe3e1;
        --good:#0e6b5c; --good-soft:#dcefe9;
        --chart-grid:#d8d0bd; --chart-axis:#8a8268;
        --shadow:0 1px 2px rgba(40,32,10,.06),0 6px 18px rgba(40,32,10,.07);
        --radius:10px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#12161d; --bg2:#171c26; --surface:#1b212d; --surface2:#222a38;
          --ink:#e8e6df; --ink2:#b6bdc9; --ink3:#8d97a8;
          --line:#333d4f; --line2:#46536a;
          --accent:#3ec9ae; --accent-ink:#7fe0cb; --accent-soft:#173b34;
          --amber:#f0b45a; --amber-soft:#3d2f14;
          --red:#ff9d94; --red-soft:#42201d;
          --good:#3ec9ae; --good-soft:#173b34;
          --chart-grid:#2c3547; --chart-axis:#6d7889;
          --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
        }
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{margin:0;background:var(--bg);color:var(--ink);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        font-size:16px;line-height:1.5}
      .serif{font-family:"Iowan Old",Palatino,"Palatino Linotype",Georgia,serif}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      a{color:var(--accent-ink)}
      :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
      button{font:inherit;cursor:pointer}
      input,select{font:inherit;color:var(--ink)}
      .wrap{max-width:1180px;margin:0 auto;padding:0 18px 64px}

      /* ---------- top bar ---------- */
      .topbar{border-bottom:1px solid var(--line);background:var(--bg2)}
      .topbar-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
      .brand{font-family:"Iowan Old",Palatino,Georgia,serif;font-weight:700;font-size:19px;color:var(--ink);text-decoration:none;letter-spacing:.01em}
      .brand span{color:var(--accent-ink)}
      .topnav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
      .topnav a{color:var(--ink2);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:8px}
      .topnav a:hover{background:var(--surface2);color:var(--ink)}
      .topnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

      /* ---------- hub ---------- */
      .hero{padding:38px 0 8px}
      .hero h1{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:clamp(28px,4.6vw,42px);line-height:1.12;margin:0 0 10px;font-weight:700;max-width:20em}
      .hero p{color:var(--ink2);max-width:44em;margin:0;font-size:17px}
      .hub-tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 6px;align-items:center}
      .searchbox{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:0 12px}
      .searchbox input{border:0;background:transparent;padding:11px 0;width:100%;outline:none}
      .chip{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:14px}
      .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
      @media (prefers-color-scheme: dark){.chip[aria-pressed="true"]{color:#0c1714}}
      .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;margin-top:18px}
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
      .card:hover{border-color:var(--accent)}
      .card .cat{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
      .card h2{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:21px;margin:0;line-height:1.25}
      .card p{margin:0;color:var(--ink2);font-size:14.5px}
      .card .meta{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--ink3);display:flex;justify-content:space-between;gap:8px}
      .card .go{color:var(--accent-ink);font-weight:600;white-space:nowrap}
      .roadmap{margin-top:36px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
      .roadmap h2{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:19px;margin:0 0 6px}
      .roadmap p{margin:0 0 8px;color:var(--ink2);font-size:14.5px}
      .roadmap ul{margin:0;padding-left:20px;color:var(--ink2);font-size:14.5px;columns:2;column-gap:32px}
      @media (max-width:640px){.roadmap ul{columns:1}}
      .noresults{color:var(--ink2);padding:24px 0}

      /* ---------- tool shell ---------- */
      .backlink{display:inline-block;margin:20px 0 4px;font-size:14px;text-decoration:none}
      .toolhead h1{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:clamp(26px,4vw,36px);margin:2px 0 6px;line-height:1.15}
      .toolhead .cat{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
      .toolhead p.sub{color:var(--ink2);margin:0 0 12px;max-width:46em}
      .objbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0 20px}
      .objbox>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
      .objbox h3{margin:0 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
      .objbox p{margin:0;font-size:14.5px;color:var(--ink2)}
      .layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
      @media (max-width:900px){.layout{grid-template-columns:1fr}}
      .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
      .panel h2{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:19px;margin:0 0 10px}
      .panel h3{font-size:15px;margin:16px 0 6px}
      .panel h3:first-of-type{margin-top:4px}
      .stack{display:flex;flex-direction:column;gap:20px;min-width:0}
      fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 14px;padding:10px 12px 12px}
      legend{font-size:13px;font-weight:700;color:var(--ink2);padding:0 4px}
      label.fl{display:block;font-size:13.5px;font-weight:600;margin:10px 0 4px}
      label.fl:first-child{margin-top:0}
      .hint{font-size:12.5px;color:var(--ink3);font-weight:400}
      input[type="number"],input[type="text"],select{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
      input[type="range"]{width:100%;accent-color:var(--accent);padding:6px 0}
      .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
      .btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:15px;text-decoration:none}
      @media (prefers-color-scheme: dark){.btn{color:#0c1714}}
      .btn.secondary{background:transparent;color:var(--accent-ink)}
      .btn.small{padding:6px 11px;font-size:13.5px}
      .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
      canvas.chart{width:100%;height:auto;display:block;background:var(--surface)}
      .readout{font-size:14.5px;color:var(--ink2)}
      .readout strong{color:var(--ink)}
      .bigstat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 2px}
      .bigstat div{min-width:110px}
      .bigstat .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:700;color:var(--ink)}
      .bigstat .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
      table.data{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
      table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right}
      table.data th:first-child,table.data td:first-child{text-align:left}
      table.data th{color:var(--ink2);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
      table.data td.num,table.data th.num{font-family:ui-monospace,Menlo,Consolas,monospace}
      tr.hl td{background:var(--accent-soft);font-weight:600}
      tr.out td{background:var(--red-soft)}
      .tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;vertical-align:1px}
      .tag.bind{background:var(--amber-soft);color:var(--amber)}
      .tag.ok{background:var(--good-soft);color:var(--good)}
      .tag.bad{background:var(--red-soft);color:var(--red)}
      .banner{border-radius:8px;padding:11px 14px;font-size:14.5px;margin:12px 0;border:1px solid}
      .banner.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
      .banner.bad{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
      .banner.good{background:var(--good-soft);border-color:var(--good);color:var(--ink)}

      /* predict / check */
      .teach{border:1px solid var(--line2);border-radius:var(--radius);padding:16px;background:var(--surface)}
      .teach .step{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
      .teach h2{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:19px;margin:2px 0 8px}
      .teach p.q{margin:0 0 10px;font-size:15px}
      .opts{display:flex;flex-direction:column;gap:8px}
      .opts label{display:flex;gap:9px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14.5px;cursor:pointer}
      .opts input{margin-top:3px;accent-color:var(--accent)}
      .feedback{margin-top:10px;font-size:14.5px;border-radius:8px;padding:10px 12px;display:none}
      .feedback.show{display:block}
      .feedback.right{background:var(--good-soft);border:1px solid var(--good)}
      .feedback.wrong{background:var(--red-soft);border:1px solid var(--red)}

      /* sensitivity sliders */
      .sensctl{border-bottom:1px solid var(--line);padding:10px 0}
      .sensctl:last-child{border-bottom:0}
      .sensctl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
      .sensctl .lab b{font-size:14.5px}
      .sensctl .pair{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center}
      .rangebar{position:relative;height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;margin-top:7px}
      .rangebar .zone{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.45;border-radius:6px}
      .rangebar .mark{position:absolute;top:-3px;width:3px;height:14px;background:var(--ink);border-radius:2px}
      .rangebar .mark.out{background:var(--red)}
      .rangebar-cap{font-size:12px;color:var(--ink3);margin-top:3px}
      /* tornado */
      .tornado{display:flex;flex-direction:column;gap:9px;margin-top:6px}
      .trow{display:grid;grid-template-columns:150px 1fr 86px;gap:10px;align-items:center;font-size:13.5px}
      @media (max-width:560px){.trow{grid-template-columns:104px 1fr 70px}}
      .tbar{position:relative;height:16px;background:var(--surface2);border-radius:4px}
      .tbar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:4px;opacity:.8}
      .trow .tv{font-family:ui-monospace,Menlo,Consolas,monospace;text-align:right}
      /* sensitivity lab (mirror layout) */
      .solstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:20px}
      @media(max-width:1000px){.solstrip{grid-template-columns:repeat(3,1fr)}}
      @media(max-width:520px){.solstrip{grid-template-columns:repeat(2,1fr)}}
      .ss .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;font-weight:700;color:var(--ink)}
      .ss .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
      .ss .v.pos{color:var(--good)} .ss .v.neg{color:var(--red)}
      .sens-grid{display:grid;gap:20px;margin-top:20px;align-items:start}
      @media(min-width:1200px){.sens-grid{grid-template-columns:1fr 1.5fr 1fr;grid-template-areas:"form model twod" "ctls model twod"}}
      @media(min-width:900px) and (max-width:1199.98px){.sens-grid{grid-template-columns:1fr 1.4fr;grid-template-areas:"form model" "ctls model" "twod twod"}}
      @media(max-width:899.98px){.sens-grid{grid-template-columns:1fr;grid-template-areas:"ctls" "model" "twod" "form"}}
      .ga-form{grid-area:form}.ga-ctls{grid-area:ctls}.ga-model{grid-area:model}.ga-twod{grid-area:twod}
      .panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
      .panelhead h2{margin:0}
      .formline{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;border:1px solid transparent;font-size:14px}
      .formline .flab{flex:0 0 104px;font-weight:700;color:var(--ink2);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
      .formline .feq{font-family:ui-monospace,Menlo,Consolas,monospace}
      .formline.active{background:var(--amber-soft);border-color:var(--amber)}
      .meter-lims{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:2px}
      .ctl-status{font-size:13px;font-weight:700;margin-top:5px}
      .ctl-status.in{color:var(--good)} .ctl-status.out{color:var(--red)}
      .legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:12.5px;color:var(--ink2)}
      .lgi{display:inline-flex;align-items:center;gap:6px}
      .lgi i{width:14px;height:4px;border-radius:2px;display:inline-block;flex:none}
      .lgi i.dot{width:9px;height:9px;border-radius:50%}
      .lgi i.ring{background:transparent;border:2px solid var(--chart-axis);width:6px;height:6px}
      canvas.cv3d{touch-action:none;cursor:grab}
      canvas.cv3d:active{cursor:grabbing}
      .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
      .report-grid>div{min-width:0}
      .sens-grid>*{min-width:0}
      @media(max-width:900px){.report-grid{grid-template-columns:1fr}}
      .tscroll{overflow-x:auto}
      .tree-wrap{overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:8px;min-height:340px}
      .tree-wrap svg{display:block;min-width:640px;width:100%;height:auto}
      .tnode{cursor:pointer}
      .tnode:focus{outline:none}
      .tnode:focus .tnode-box{stroke:var(--accent);stroke-width:3}
      .qchart-wrap{margin-top:6px}
      .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:8px}
      .statgrid>div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
      .statgrid .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;color:var(--ink)}
      .statgrid .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
      footer.note{margin-top:44px;border-top:1px solid var(--line);padding-top:14px;color:var(--ink3);font-size:13.5px;max-width:52em}
      .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
      @media print{.topbar,.btnrow,.hub-tools{display:none}}
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-in">
        <a class="brand" href="#/">Analytics<span>Lab</span></a>
        <nav class="topnav" aria-label="Tools">
          <a href="#/lp" data-nav="lp">LP Explorer</a>
          <a href="#/sensitivity" data-nav="sensitivity">LP Sensitivity</a>
          <a href="#/lp3d" data-nav="lp3d">LP 3D</a>
          <a href="#/clt" data-nav="clt">CLT &amp; CI Lab</a>
          <a href="#/decision" data-nav="decision">Decision Lab</a>
          <a href="#/tree" data-nav="tree">Decision Tree</a>
          <a href="#/queue" data-nav="queue">Queuing Lab</a>
        </nav>
      </div>
    </div>
    <main class="wrap" id="app" tabindex="-1"></main>
    <script>
    "use strict";
    /* ================= utilities ================= */
    var $=function(s,r){return (r||document).querySelector(s)};
    var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
    function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstElementChild}
    function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
    function fmt(x,d){if(x===null||x===undefined||!isFinite(x))return "—";d=(d===undefined?2:d);return Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
    function fmt0(x){return fmt(x,0)}
    function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    function encState(o){try{return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(e){return ""}}
    function decState(s){try{return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))))}catch(e){return null}}
    function setHash(route,state){var h="#/"+route+(state?"?s="+encState(state):"");if(location.hash!==h)history.replaceState(null,"",h)}
    function dl(name,text){var b=new Blob([text],{type:"text/plain"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},400)}
    function fitCanvas(cv){var r=cv.getBoundingClientRect();var d=window.devicePixelRatio||1;var w=Math.max(300,Math.round(r.width));var h=Math.round(w*(cv.dataset.ratio?parseFloat(cv.dataset.ratio):0.68));cv.width=w*d;cv.height=h*d;cv.style.height=h+"px";var ctx=cv.getContext("2d");ctx.setTransform(d,0,0,d,0,0);return{ctx:ctx,W:w,H:h}}
    function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

    /* ================= shared LP core (2 variables) =================
       problem: {cx, cy, sense:'max'|'min', cons:[{a,b,op,rhs,name}]} plus x,y >= 0 */
    var OKTO={
      cx:4, cy:3, sense:"max",
      xname:"OktoValve masks (Xv)", yname:"OktoPrint masks (Xp)",
      cons:[
        {a:2,   b:0, op:"<=", rhs:1000, name:"C1 · Valves"},
        {a:2.5, b:1, op:"<=", rhs:1600, name:"C2 · Labor"},
        {a:2.7, b:3, op:"<=", rhs:2688, name:"C3 · Fabric"},
        {a:-1,  b:1, op:"<=", rhs:200,  name:"C4 · Print − Valve difference"},
        {a:1,   b:1, op:">=", rhs:100,  name:"C5 · Minimum commitment"}
      ]
    };
    function oktoCopy(){return JSON.parse(JSON.stringify(OKTO))}
    function satisfies(c,x,y,tol){var v=c.a*x+c.b*y;tol=tol||1e-7;if(c.op==="<=")return v<=c.rhs+tol;if(c.op===">=")return v>=c.rhs-tol;return Math.abs(v-c.rhs)<=tol}
    function feasible(P,x,y){for(var i=0;i<P.cons.length;i++)if(!satisfies(P.cons[i],x,y,1e-6))return false;return x>=-1e-9&&y>=-1e-9}
    function objAt(P,x,y){return P.cx*x+P.cy*y}
    function allLines(P){var L=P.cons.map(function(c){return{a:c.a,b:c.b,r:c.rhs,idx:-1}});L.push({a:1,b:0,r:0,idx:-2});L.push({a:0,b:1,r:0,idx:-3});return L}
    function solveLP(P){
      var L=allLines(P),pts=[],i,j;
      for(i=0;i<L.length;i++)for(j=i+1;j<L.length;j++){
        var d=L[i].a*L[j].b-L[j].a*L[i].b;if(Math.abs(d)<1e-12)continue;
        var x=(L[i].r*L[j].b-L[j].r*L[i].b)/d, y=(L[i].a*L[j].r-L[j].a*L[i].r)/d;
        if(x<-1e-9||y<-1e-9)continue;x=Math.max(0,x);y=Math.max(0,y);
        if(!feasible(P,x,y))continue;

    /* ================= LP SENSITIVITY LAB ================= */
    var CONCOLS=["#c2410c","#0369a1","#7c3aed","#be185d","#15803d","#a16207"];
    function trimNum(x){if(x===null||x===undefined||isNaN(x))return "—";if(!isFinite(x))return "1E+30";var s=fmt(x,4);s=s.replace(/(\.\d*?)0+$/,"$1").replace(/\.$/,"");return s}
    /* ---- 3D geometry: plain-canvas projection, drag rotate / wheel+pinch zoom ---- */
    function draw3D(cv,P,sol,baseOpt,view,activeCi){
      var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
      var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),ink=cssVar("--ink"),acc=cssVar("--accent"),red=cssVar("--red"),surf2=cssVar("--surface2");
      var XR=10,YR=10,i;
      P.cons.forEach(function(c){if(c.a>0)XR=Math.max(XR,c.rhs/c.a);if(c.b>0)YR=Math.max(YR,c.rhs/c.b)});
      sol.vertices.forEach(function(v){XR=Math.max(XR,v.x);YR=Math.max(YR,v.y)});
      if(sol.opt){XR=Math.max(XR,sol.opt.x);YR=Math.max(YR,sol.opt.y)}
      if(baseOpt){XR=Math.max(XR,baseOpt.x);YR=Math.max(YR,baseOpt.y)}
      XR=Math.min(XR*1.12,1e6);YR=Math.min(YR*1.12,1e6);
      var M=Math.max(XR,YR);
      var zmax=1;sol.vertices.forEach(function(v){zmax=Math.max(zmax,v.z)});if(baseOpt)zmax=Math.max(zmax,baseOpt.z);
      var zS=0.66*M/(zmax*1.08);
      var ca=Math.cos(view.az),sa=Math.sin(view.az),ce=Math.cos(view.el),se=Math.sin(view.el);
      var S=view.zoom*Math.min(W,H)/(1.62*M);
      function pr(x,y,z){
        var X=x-XR/2,Y=y-YR/2,Z=z*zS;
        var x1=X*ca-Y*sa,y1=X*sa+Y*ca;
        var z2=Z*ce-y1*se;
        return{x:W/2+x1*S,y:H*0.60-z2*S};
      }
      function line(a,b,style,w,dash){ctx.strokeStyle=style;ctx.lineWidth=w||1;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}
      function dot(p,r,fill,stroke){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.6;ctx.stroke()}}
      ctx.clearRect(0,0,W,H);
      /* floor */
      var f00=pr(0,0,0),f10=pr(XR,0,0),f11=pr(XR,YR,0),f01=pr(0,YR,0);
      ctx.beginPath();ctx.moveTo(f00.x,f00.y);ctx.lineTo(f10.x,f10.y);ctx.lineTo(f11.x,f11.y);ctx.lineTo(f01.x,f01.y);ctx.closePath();
      ctx.fillStyle=surf2;ctx.globalAlpha=.55;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=grid;ctx.lineWidth=1;ctx.stroke();
      function niceStep(m){var p=Math.pow(10,Math.floor(Math.log10(m)));var s=m/p;return (s<=1?1:s<=2?2:s<=2.5?2.5:s<=5?5:10)*p}
      var gx=niceStep(XR/4),gy=niceStep(YR/4),v;
      for(v=gx;v<XR;v+=gx)line(pr(v,0,0),pr(v,YR,0),grid,1);
      for(v=gy;v<YR;v+=gy)line(pr(0,v,0),pr(XR,v,0),grid,1);
      /* axes */
      line(pr(0,0,0),pr(XR,0,0),axis,1.6);line(pr(0,0,0),pr(0,YR,0),axis,1.6);line(pr(0,0,0),pr(0,0,zmax*1.08),axis,1.6);
      ctx.fillStyle=axis;ctx.font="bold 12px system-ui";ctx.textAlign="left";
      var lx=pr(XR,0,0);ctx.fillText("Xv",lx.x+5,lx.y+4);
      var ly=pr(0,YR,0);ctx.fillText("Xp",ly.x-6,ly.y-7);
      var lz=pr(0,0,zmax*1.08);ctx.fillText("Profit",lz.x-14,lz.y-8);
      /* feasible region on the floor */
      var poly=feasiblePolygon(P,XR,YR);
      if(poly.length>2){ctx.beginPath();poly.forEach(function(p,i2){var q=pr(p.x,p.y,0);if(i2===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=acc;ctx.globalAlpha=.20;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=acc;ctx.lineWidth=1.6;ctx.stroke()}
      /* constraint lines on the floor, in legend colors */
      function lineSeg(c){
        var pts=[];
        function add(x,y){if(x>=-1e-9&&x<=XR+1e-9&&y>=-1e-9&&y<=YR+1e-9){for(var k=0;k<pts.length;k++)if(Math.hypot(pts[k].x-x,pts[k].y-y)<1e-6)return;pts.push({x:Math.max(0,Math.min(XR,x)),y:Math.max(0,Math.min(YR,y))})}}
        if(Math.abs(c.b)>1e-12){add(0,c.rhs/c.b);add(XR,(c.rhs-c.a*XR)/c.b)}
        if(Math.abs(c.a)>1e-12){add(c.rhs/c.a,0);add((c.rhs-c.b*YR)/c.a,YR)}
        return pts.length>=2?[pts[0],pts[1]]:null;
      }
      P.cons.forEach(function(c,i2){var sg=lineSeg(c);if(sg)line(pr(sg[0].x,sg[0].y,0),pr(sg[1].x,sg[1].y,0),CONCOLS[i2%6],i2===activeCi?3.4:1.8)});
      /* faint full profit plane over the floor */
      var pc=[pr(0,0,0),pr(XR,0,P.cx*XR),pr(XR,YR,P.cx*XR+P.cy*YR),pr(0,YR,P.cy*YR)];
      ctx.beginPath();ctx.moveTo(pc[0].x,pc[0].y);for(i=1;i<4;i++)ctx.lineTo(pc[i].x,pc[i].y);ctx.closePath();
      ctx.fillStyle=acc;ctx.globalAlpha=.07;ctx.fill();ctx.globalAlpha=1;
      /* active constraint: translucent wall from its floor line up to the plane */
      if(activeCi!==null&&activeCi!==undefined&&poly.length>2){
        var ac2=P.cons[activeCi];
        for(i=0;i<poly.length;i++){var pA=poly[i],pB=poly[(i+1)%poly.length];
          if(Math.abs(ac2.a*pA.x+ac2.b*pA.y-ac2.rhs)<1e-4&&Math.abs(ac2.a*pB.x+ac2.b*pB.y-ac2.rhs)<1e-4){
            var w1=pr(pA.x,pA.y,0),w2=pr(pB.x,pB.y,0),w3=pr(pB.x,pB.y,objAt(P,pB.x,pB.y)),w4=pr(pA.x,pA.y,objAt(P,pA.x,pA.y));
            ctx.beginPath();ctx.moveTo(w1.x,w1.y);ctx.lineTo(w2.x,w2.y);ctx.lineTo(w3.x,w3.y);ctx.lineTo(w4.x,w4.y);ctx.closePath();
            ctx.fillStyle=CONCOLS[activeCi%6];ctx.globalAlpha=.16;ctx.fill();ctx.globalAlpha=1;break;
          }}
      }
      /* profit surface over the feasible region */
      if(sol.status==="optimal"&&poly.length>2){
        var cen={x:0,y:0};poly.forEach(function(p){cen.x+=p.x/poly.length;cen.y+=p.y/poly.length});
        var cTop=pr(cen.x,cen.y,objAt(P,cen.x,cen.y));
        for(i=0;i<poly.length;i++){
          var q1=pr(poly[i].x,poly[i].y,objAt(P,poly[i].x,poly[i].y));
          var pn=poly[(i+1)%poly.length],q2=pr(pn.x,pn.y,objAt(P,pn.x,pn.y));
          ctx.beginPath();ctx.moveTo(cTop.x,cTop.y);ctx.lineTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.closePath();
          ctx.fillStyle=acc;ctx.globalAlpha=.30;ctx.fill();ctx.globalAlpha=1;
        }
        for(i=0;i<poly.length;i++){
          var pA2=poly[i],pB2=poly[(i+1)%poly.length],mx=(pA2.x+pB2.x)/2,my=(pA2.y+pB2.y)/2,ci2=-1;
          P.cons.forEach(function(c,k){if(Math.abs(c.a*mx+c.b*my-c.rhs)<1e-4)ci2=k});
          line(pr(pA2.x,pA2.y,objAt(P,pA2.x,pA2.y)),pr(pB2.x,pB2.y,objAt(P,pB2.x,pB2.y)),ci2>=0?CONCOLS[ci2%6]:acc,ci2===activeCi?3.4:2);
        }
      }
      /* extreme points */
      sol.vertices.forEach(function(v2){dot(pr(v2.x,v2.y,0),2.6,ink);if(sol.status==="optimal")dot(pr(v2.x,v2.y,v2.z),3,ink)});
      /* base optimum ghost */
      if(baseOpt){var g0=pr(baseOpt.x,baseOpt.y,0),g1=pr(baseOpt.x,baseOpt.y,baseOpt.z);
        line(g0,g1,axis,1.4,[4,3]);dot(g0,4,null,axis);dot(g1,4.5,null,axis);
        ctx.fillStyle=axis;ctx.font="11px system-ui";ctx.fillText("base optimum",g0.x+7,g0.y+14)}
      /* optimum with drop line */
      if(sol.opt){var o0=pr(sol.opt.x,sol.opt.y,0),o1=pr(sol.opt.x,sol.opt.y,sol.opt.z);
        line(o0,o1,red,1.8,[5,4]);dot(o0,4.5,red);dot(o1,5.5,red);
        ctx.fillStyle=red;ctx.font="bold 12px system-ui";ctx.fillText("optimum ("+trimNum(sol.opt.x)+", "+trimNum(sol.opt.y)+")",o1.x+9,o1.y-6)}
    }
    function renderSens(app,state){
      var B=oktoCopy();                       /* base problem: always the Oktomasks problem */
      var baseSol=solveLP(B);
      var W={cx:B.cx,cy:B.cy,rhs:B.cons.map(function(c){return c.rhs})};
      if(state&&state.v&&state.v.length===7&&isFinite(+state.v[0])){W.cx=+state.v[0];W.cy=+state.v[1];for(var vi=0;vi<5;vi++)W.rhs[vi]=+state.v[2+vi]}
      function whatIfProblem(){var P=JSON.parse(JSON.stringify(B));P.cx=W.cx;P.cy=W.cy;P.cons.forEach(function(c,i){c.rhs=W.rhs[i]});return P}
      function setVal(k,v){if(k==="cx")W.cx=v;else if(k==="cy")W.cy=v;else W.rhs[+k.slice(1)]=v}
      function getVal(k){if(k==="cx")return W.cx;if(k==="cy")return W.cy;return W.rhs[+k.slice(1)]}
      var p0={x:baseSol.opt.x,y:baseSol.opt.y};
      var allowObj=[allowableObj(B,p0,0),allowableObj(B,p0,1)];
      var allowRhs=B.cons.map(function(c,i){return allowableRHS(B,p0,i)});
      var basePrices=shadowPrices(B,p0).prices;
      var PARAMS=[
        {key:"cx",label:"OktoValve profit coefficient",min:0,max:10,step:0.1,base:B.cx,line:"obj",allow:allowObj[0]},
        {key:"cy",label:"OktoPrint profit coefficient",min:0,max:10,step:0.1,base:B.cy,line:"obj",allow:allowObj[1]},
        {key:"r0",label:"Valves available",min:250,max:1600,step:10,base:B.cons[0].rhs,line:"c0",allow:allowRhs[0]},
        {key:"r1",label:"Labor available",min:700,max:2300,step:10,base:B.cons[1].rhs,line:"c1",allow:allowRhs[1]},
        {key:"r2",label:"Fabric available",min:1200,max:3800,step:12,base:B.cons[2].rhs,line:"c2",allow:allowRhs[2]},
        {key:"r3",label:"#OktoPrints may exceed #OktoValves by",min:0,max:600,step:5,base:B.cons[3].rhs,line:"c3",allow:allowRhs[3]},
        {key:"r4",label:"Minimum total demand",min:0,max:700,step:10,base:B.cons[4].rhs,line:"c4",allow:allowRhs[4]}
      ];

        $("#clt-stats").innerHTML='<div class="bigstat"><div><div class="v">'+fmt(mm,1)+'</div><div class="k">Mean of means (μ = '+fmt(pop.mu,1)+')</div></div>'+
          '<div><div class="v">'+fmt(last.sdm,1)+'</div><div class="k">SD of means (σ/√n = '+fmt(se,1)+')</div></div>'+
          '<div><div class="v">'+fmt(100*capture/S.reps,1)+'%</div><div class="k">Intervals capturing μ (target '+S.conf+'%)</div></div></div>'+
          '<p>'+S.reps.toLocaleString()+' samples of size '+S.n+' from the <strong>'+esc(pop.label.split(" — ")[0])+'</strong> population (intervals use the t critical value with n − 1 degrees of freedom). '+(S.n<10?'With n this small the histogram still leans with the population — push n toward 30 and run again. ':'')+(Math.abs(100*capture/S.reps-(+S.conf))>4&&S.n<30?'Coverage is running below the level here: the interval formula leans on the CLT, and at this sample size the sampling distribution has not finished turning normal. Raise n and watch the capture rate climb toward '+S.conf+'%.':'')+'</p>';

      function drawHist(means,pop,mm,sdm,se){
        var cv=$("#clt-cv"),f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
        var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),ink=cssVar("--ink"),acc=cssVar("--accent"),amb=cssVar("--amber");
        var lo=Math.min.apply(null,means),hi=Math.max.apply(null,means);lo=Math.min(lo,pop.mu-3.4*se);hi=Math.max(hi,pop.mu+3.4*se);
        var bins=26,bw=(hi-lo)/bins,counts=new Array(bins).fill(0);
        means.forEach(function(m){var b=Math.min(bins-1,Math.floor((m-lo)/bw));counts[b]++});
        var peak=Math.max.apply(null,counts),normPeak=S2(0);

        ctx.fillStyle=acc;counts.forEach(function(c,i){if(!c)return;ctx.fillRect(X(lo+i*bw)+1,Y(c),pw/bins-2,ph-(Y(c)-padT))});
        ctx.strokeStyle=amb;ctx.lineWidth=2.2;ctx.beginPath();
        for(var px=0;px<=pw;px+=3){var x=lo+(hi-lo)*px/pw,yv=means.length*bw*S2(x);if(px===0)ctx.moveTo(padL+px,Y(yv));else ctx.lineTo(padL+px,Y(yv))}
        ctx.stroke();ctx.lineWidth=1;
        ctx.strokeStyle=cssVar("--red");ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(X(pop.mu),padT);ctx.lineTo(X(pop.mu),padT+ph);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle=cssVar("--red");ctx.textAlign="left";ctx.fillText("μ = "+fmt(pop.mu,0),X(pop.mu)+5,padT+11);
        cv.setAttribute("aria-label","Histogram of "+means.length+" sample means. Mean of means "+fmt(mm,1)+", standard deviation "+fmt(sdm,1)+", theoretical standard error "+fmt(se,1)+".");
      }
      function drawCI(intervals,pop){
        var cv=$("#clt-civ"),f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;

    /* ================= LP 3D VISUALIZER ================= */
    function drawLP3D(cv,P,sol,view,sweepZ){
      var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
      var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),ink=cssVar("--ink"),acc=cssVar("--accent"),red=cssVar("--red"),amb=cssVar("--amber"),surf2=cssVar("--surface2");
      var XR=600,YR=700,i;
      P.cons.forEach(function(c){if(c.a>0)XR=Math.max(XR,c.rhs/c.a);if(c.b>0)YR=Math.max(YR,c.rhs/c.b)});
      sol.vertices.forEach(function(v){XR=Math.max(XR,v.x);YR=Math.max(YR,v.y)});

    /* ================= QUEUING LAB ================= */
    function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r}
    function queueCompute(S){
      var lam=S.lam,model=S.model,out={ok:false};
      if(!(lam>0))return{ok:false,msg:"Arrival rate λ must be positive."};
      if(model==="mg1"){
        var mean=S.meanSvc,sd=S.sdSvc;
        if(!(mean>0))return{ok:false,msg:"Average service time must be positive."};
        if(sd<0)return{ok:false,msg:"Service-time standard deviation cannot be negative."};
        var mu1=1/mean,rho1=lam*mean;
        out.mu=mu1;out.rho=rho1;out.s=1;
        if(rho1>=1)return{ok:false,unstable:true,rho:rho1,msg:"Unstable: ρ = λ · E[S] = "+fmt(rho1,3)+" ≥ 1. Arrivals outpace service, so the queue grows without bound and no steady state exists."};
        var Lq=(lam*lam*sd*sd+rho1*rho1)/(2*(1-rho1));
        var Wq=Lq/lam,W=Wq+mean,L=lam*W;
        out.ok=true;out.L=L;out.Lq=Lq;out.W=W;out.Wq=Wq;out.P0=1-rho1;out.Pw=rho1;
        out.dist=null;
        out.notes="Pollaczek–Khinchine: Lq = (λ²σ² + ρ²) / (2(1 − ρ)). With σ = 0 this is a deterministic-service queue; as σ grows, the same average service time produces a longer wait — variability itself creates queues.";
        return out;
      }
      var mu=S.mu,s=(model==="mm1")?1:Math.max(1,Math.round(S.s));
      if(!(mu>0))return{ok:false,msg:"Service rate μ must be positive."};
      var a=lam/mu,rho=a/s;
      out.mu=mu;out.s=s;out.rho=rho;out.a=a;
      if(model==="mmsk"){
        var K=Math.max(s,Math.round(S.K));
        out.K=K;
        var w=[],sum=0,i,n;
        for(n=0;n<=K;n++){var wn=n<=s?Math.pow(a,n)/fact(n):Math.pow(a,s)/fact(s)*Math.pow(a/s,n-s);w.push(wn);sum+=wn}
        var P0=1/sum,ps=w.map(function(x){return x*P0});
        var L=0,Lq=0;ps.forEach(function(p,n2){L+=n2*p;if(n2>s)Lq+=(n2-s)*p});
        var lamEff=lam*(1-ps[K]);
        out.ok=true;out.P0=P0;out.L=L;out.Lq=Lq;out.W=L/lamEff;out.Wq=Lq/lamEff;out.lamEff=lamEff;
        var pBusy=0;for(n=s;n<=K;n++)pBusy+=ps[n];
        out.Pw=pBusy;out.Pblock=ps[K];out.dist=ps;
        out.notes="Finite capacity K = "+K+" in the system at most. Arrivals that find K already present are turned away (probability "+fmt(ps[K],4)+"), so the effective arrival rate is λ(1 − P_K) = "+fmt(lamEff,3)+", and Little's law uses that effective rate. This system is always stable — the queue cannot grow past K.";
        return out;
      }
      if(rho>=1)return{ok:false,unstable:true,rho:rho,msg:"Unstable: λ = "+trimNum(lam)+" ≥ s·μ = "+trimNum(s*mu)+". Arrivals outpace total service capacity, so the queue grows without bound and no steady state exists. Add servers or raise μ."};
      var sum2=0,i2;
      for(i2=0;i2<s;i2++)sum2+=Math.pow(a,i2)/fact(i2);
      var lastTerm=Math.pow(a,s)/(fact(s)*(1-rho));
      var P02=1/(sum2+lastTerm);
      var Pw=lastTerm*P02;
      var Lq2=Pw*rho/(1-rho);
      var Wq2=Lq2/lam,W2=Wq2+1/mu,L2=lam*W2;
      out.ok=true;out.P0=P02;out.Pw=Pw;out.L=L2;out.Lq=Lq2;out.W=W2;out.Wq=Wq2;
      /* distribution up to cumulative 0.999 or n=40 */
      var ps2=[],cum=0,nn=0;
      while(nn<=60&&(cum<0.999||nn<=s)){
        var pn=nn<s?P02*Math.pow(a,nn)/fact(nn):P02*Math.pow(a,s)/fact(s)*Math.pow(rho,nn-s);
        ps2.push(pn);cum+=pn;nn++;
        if(nn>25&&cum>=0.9995)break;
      }
      out.dist=ps2;
      out.notes=(s===1)?"M/M/1 check: with λ = 8 and μ = 10, ρ = 0.8, L = 4, Lq = 3.2, W = 0.5, Wq = 0.4 — the textbook values.":"Erlang C: the probability an arrival must wait (all "+s+" servers busy) is "+fmt(Pw,4)+". Adding a server cuts waiting sharply at first, then with diminishing returns — try s and s + 1 and compare Wq.";
      return out;
    }
    function renderQueue(app,state){
      var S=Object.assign({model:"mm1",lam:8,mu:10,s:2,K:12,meanSvc:0.1,sdSvc:0.1},state||{});
      var h=toolHead("Decision Analysis","Queuing Lab",
        "Four waiting-line models, one set of questions: how busy is the system (ρ), how many are in it on average (L, Lq), how long do they stay (W, Wq), and what is the chance an arrival finds it empty — or has to wait? Start with the textbook case λ = 8, μ = 10 in M/M/1 and check the numbers by hand; then add servers and watch the wait collapse.",
        "Choose the right queueing model for a service system, compute its steady-state measures, and recognize when a system is unstable.",
        "Little's law (L = λW); basic probability distributions; rates vs. times (μ is per hour if λ is per hour).","About 15 minutes.");
      h+=teachBox("Step 1 · Predict","Before you compute",
        "A single server handles μ = 10 customers per hour and λ = 8 arrive per hour, so the server is busy 80% of the time. The average number of customers in the system (waiting plus being served) will be:",
        ["0.8 — the utilization is the average number","About 1.6","Exactly 4 — queues build up fast as utilization approaches 1","It cannot be found without simulation"],2,
        "For M/M/1, L = ρ/(1 − ρ) = 0.8/0.2 = 4. The lesson is the nonlinearity: at ρ = 0.5, L is just 1; at ρ = 0.9 it is 9; at ρ = 0.99 it is 99. Running a service system “efficiently” near 100% utilization is exactly what makes waits explode.");
      h+='<div class="layout" style="margin-top:20px"><div class="stack">';
      h+='<section class="panel"><h2>Model &amp; inputs</h2>'+
        '<label class="fl" for="q-model">Model</label><select id="q-model"><option value="mm1">M/M/1 — one server, unlimited queue</option><option value="mms">M/M/s — s servers, unlimited queue</option><option value="mmsk">M/M/s — s servers, finite capacity</option><option value="mg1">M/G/1 — one server, general service times</option></select>'+
        '<label class="fl" for="q-lam">Arrival rate λ <span class="hint">customers per time unit</span></label><input type="number" id="q-lam" step="any" min="0">'+
        '<div id="q-mu-row"><label class="fl" for="q-mu">Service rate μ <span class="hint">per server, per time unit</span></label><input type="number" id="q-mu" step="any" min="0"></div>'+
        '<div id="q-s-row"><label class="fl" for="q-s">Number of servers s</label><input type="number" id="q-s" step="1" min="1"></div>'+
        '<div id="q-k-row"><label class="fl" for="q-k">System capacity K <span class="hint">max customers in system (≥ s)</span></label><input type="number" id="q-k" step="1" min="1"></div>'+
        '<div id="q-mg-row"><label class="fl" for="q-mean">Average service time E[S]</label><input type="number" id="q-mean" step="any" min="0"><label class="fl" for="q-sd">Service-time standard deviation σ</label><input type="number" id="q-sd" step="any" min="0"></div>'+
        '<div class="btnrow"><button type="button" class="btn secondary small" id="q-textbook">Textbook case (λ=8, μ=10)</button><button type="button" class="btn secondary small" id="q-dl">Download results (.txt)</button></div></section>';
      h+='<section class="panel"><h2>Results</h2><div id="q-out" aria-live="polite"></div></section>';
      h+='</div><div class="stack">';
      h+='<section class="panel"><h2>Steady-state distribution</h2><p class="hint">Probability of exactly n customers in the system. Long right tails are why averages alone understate the wait some customers get.</p><canvas class="chart" id="q-cv" data-ratio="0.55" role="img" aria-label="Bar chart of the steady-state probability distribution over the number of customers in the system"></canvas><div id="q-chart-note" class="readout"></div></section>';
      h+='<section class="panel"><h2>What changes with more servers?</h2><p class="hint">Same λ and μ, queue length and wait as s grows (M/M/s, unlimited queue). The first extra server does most of the work.</p><div id="q-sweep"></div></section>';
      h+=teachBox("Step 3 · Check","Check yourself",
        "Your M/M/1 results show W = 0.5 hours and Wq = 0.4 hours, with μ = 10 per hour. A classmate says Wq must be wrong because W − Wq should equal the service rate. The correct reply:",
        ["They are right — Wq should be 9.5","W − Wq = 0.1 hours is the average service time 1/μ, not the rate μ — the numbers are consistent","W and Wq are the same thing measured twice","Wq can never be smaller than W"],1,
        "Time in system = time waiting + time in service, so W − Wq = 1/μ = 0.1 hours (6 minutes). Confusing a rate (10 per hour) with its reciprocal time (0.1 hours) is the most common units error in queueing — and Little's law, L = λW = 8 × 0.5 = 4, cross-checks the rest.");
      h+='</div></div>';
      app.innerHTML=h;
      $("#q-model").value=S.model;$("#q-lam").value=S.lam;$("#q-mu").value=S.mu;$("#q-s").value=S.s;$("#q-k").value=S.K;$("#q-mean").value=S.meanSvc;$("#q-sd").value=S.sdSvc;
      var last=null;
      function readCtl(){
        S={model:$("#q-model").value,lam:parseFloat($("#q-lam").value)||0,mu:parseFloat($("#q-mu").value)||0,s:parseInt($("#q-s").value)||1,K:parseInt($("#q-k").value)||1,meanSvc:parseFloat($("#q-mean").value)||0,sdSvc:parseFloat($("#q-sd").value)||0};
        var mg=S.model==="mg1";
        $("#q-mu-row").style.display=mg?"none":"";
        $("#q-s-row").style.display=(S.model==="mms"||S.model==="mmsk")?"":"none";
        $("#q-k-row").style.display=S.model==="mmsk"?"":"none";
        $("#q-mg-row").style.display=mg?"":"none";
        setHash("queue",S);
      }
      function stat(k,v){return '<div><div class="v">'+v+'</div><div class="k">'+k+'</div></div>'}
      function sync(){
        readCtl();var R=queueCompute(S);last=R;
        var out=$("#q-out");
        if(!R.ok){
          out.innerHTML='<div class="banner '+(R.unstable?"bad":"warn")+'"><strong>'+(R.unstable?"Stability warning. ":"Check the inputs. ")+'</strong>'+esc(R.msg||"")+(R.rho!==undefined?'<br>Utilization ρ = <strong>'+fmt(R.rho,3)+'</strong>':"")+'</div>';
          drawDist(null);drawSweep();
          return;
        }
        var modelName={"mm1":"M/M/1","mms":"M/M/s","mmsk":"M/M/s (finite)","mg1":"M/G/1"}[S.model];
        out.innerHTML='<p class="readout" style="margin-top:0">'+modelName+' · λ = '+trimNum(S.lam)+(S.model==="mg1"?" · E[S] = "+trimNum(S.meanSvc)+" (μ = "+fmt(R.mu,3)+"), σ = "+trimNum(S.sdSvc):" · μ = "+trimNum(R.mu)+" · s = "+R.s)+(R.K?" · K = "+R.K:"")+'</p>'+
          '<div class="statgrid">'+
          stat("Utilization ρ",fmt(R.rho,4))+
          stat("L — in system",fmt(R.L,4))+
          stat("Lq — in queue",fmt(R.Lq,4))+
          stat("W — time in system",fmt(R.W,4))+
          stat("Wq — time in queue",fmt(R.Wq,4))+
          stat("P₀ — system empty",fmt(R.P0,4))+
          stat(S.model==="mmsk"?"P(all servers busy)":"P(arrival waits)",fmt(R.Pw,4))+
          (R.Pblock!==undefined?stat("P(turned away)",fmt(R.Pblock,4)):"")+
          '</div>'+
          '<p class="readout" style="margin-top:10px">'+esc(R.notes||"")+'</p>'+
          '<p class="readout">Little\'s law cross-check: λ'+(R.lamEff?" (effective) = "+fmt(R.lamEff,3):" = "+trimNum(S.lam))+' × W = '+fmt((R.lamEff||S.lam)*R.W,3)+' ≈ L = '+fmt(R.L,3)+'.</p>';
        drawDist(R);drawSweep();
      }
      function drawDist(R){
        var cv=$("#q-cv"),note=$("#q-chart-note");
        if(!R||!R.dist){if(note)note.innerHTML=S.model==="mg1"?"<p>M/G/1 gives the mean measures on the left; its full distribution depends on the whole service-time distribution, not just its mean and standard deviation, so no distribution chart is drawn for this model.</p>":"";
          var f0=fitCanvas(cv);f0.ctx.clearRect(0,0,f0.W,f0.H);return}
        note.innerHTML="";
        var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
        var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),acc=cssVar("--accent");
        var ps=R.dist,maxP=Math.max.apply(null,ps);
        var padL=44,padR=12,padT=12,padB=30,pw=W-padL-padR,ph=H-padT-padB;
        ctx.clearRect(0,0,W,H);ctx.font="11px ui-monospace,monospace";ctx.fillStyle=axis;ctx.strokeStyle=grid;
        for(var g=0;g<=4;g++){var gy=maxP*g/4,y=padT+ph-ph*g/4;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+pw,y);ctx.stroke();ctx.textAlign="right";ctx.fillText(fmt(gy,2),padL-6,y+4)}
        var bw=pw/ps.length;
        ps.forEach(function(p,i){if(p<0.0004&&i>10)return;var bh=ph*p/maxP;ctx.fillStyle=acc;ctx.fillRect(padL+i*bw+1,padT+ph-bh,Math.max(2,bw-2),bh);
          if(ps.length<=26||i%2===0){ctx.fillStyle=axis;ctx.textAlign="center";ctx.fillText(i,padL+i*bw+bw/2,H-14)}});
        ctx.textAlign="center";ctx.fillText("n — customers in system →",padL+pw/2,H-2);
        cv.setAttribute("aria-label","Steady-state distribution. Most likely counts: "+ps.map(function(p,i){return [p,i]}).sort(function(a,b){return b[0]-a[0]}).slice(0,3).map(function(x){return "n = "+x[1]+" at "+fmt(x[0],3)}).join(", ")+".");
      }
      function drawSweep(){
        if(S.model==="mg1"){$("#q-sweep").innerHTML='<p class="readout">Server-count comparison applies to the M/M/s family — switch the model to M/M/s to see it.</p>';return}
        var rows="";
        for(var s=1;s<=6;s++){
          var R=queueCompute({model:"mms",lam:S.lam,mu:S.mu,s:s,K:S.K,meanSvc:S.meanSvc,sdSvc:S.sdSvc});
          if(!R.ok){rows+='<tr><td class="num">'+s+'</td><td colspan="4">unstable (ρ = '+fmt(R.rho||0,2)+' ≥ 1)</td></tr>'}
          else rows+='<tr'+(s===R.s&&false?"":"")+'><td class="num">'+s+'</td><td class="num">'+fmt(R.rho,3)+'</td><td class="num">'+fmt(R.Lq,3)+'</td><td class="num">'+fmt(R.Wq,4)+'</td><td class="num">'+fmt(R.Pw,3)+'</td></tr>';
        }
        $("#q-sweep").innerHTML='<table class="data"><thead><tr><th class="num">Servers s</th><th class="num">ρ</th><th class="num">Lq</th><th class="num">Wq</th><th class="num">P(wait)</th></tr></thead><tbody>'+rows+'</tbody></table>';
      }
      ["q-model","q-lam","q-mu","q-s","q-k","q-mean","q-sd"].forEach(function(id){$("#"+id).addEventListener("input",sync);$("#"+id).addEventListener("change",sync)});
      $("#q-textbook").addEventListener("click",function(){S={model:"mm1",lam:8,mu:10,s:2,K:12,meanSvc:0.1,sdSvc:0.1};$("#q-model").value="mm1";$("#q-lam").value=8;$("#q-mu").value=10;sync()});
      $("#q-dl").addEventListener("click",function(){if(!last||!last.ok){dl("queuing-results.txt","Queuing Lab\nNo steady-state results (system unstable or inputs invalid).\n");return}
        dl("queuing-results.txt","Queuing Lab — results\nModel: "+S.model+"\nlambda = "+S.lam+", mu = "+last.mu+", servers = "+last.s+(last.K?", K = "+last.K:"")+"\nUtilization rho = "+fmt(last.rho,4)+"\nL = "+fmt(last.L,4)+", Lq = "+fmt(last.Lq,4)+"\nW = "+fmt(last.W,4)+", Wq = "+fmt(last.Wq,4)+"\nP0 (empty) = "+fmt(last.P0,4)+", P(wait) = "+fmt(last.Pw,4)+"\n")});
      sync();
      window.addEventListener("resize",function(){if(document.getElementById("q-cv")&&last)drawDist(last)});
    }

    /* ================= ROUTER ================= */
    function parseHash(){
      var h=location.hash.replace(/^#\/?/,"");var parts=h.split("?");var route=parts[0]||"";
      var state=null;if(parts[1]){var m=parts[1].match(/(?:^|&)s=([^&]+)/);if(m)state=decState(decodeURIComponent(m[1]))}
      return{route:route,state:state};
    }
    function route(){
      var r=parseHash(),app=$("#app");
      $$(".topnav a").forEach(function(a){if(a.dataset.nav===r.route)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
      window.scrollTo(0,0);
      if(r.route==="lp")renderLP(app,r.state);
      else if(r.route==="sensitivity")renderSens(app,r.state);
      else if(r.route==="lp3d")renderLP3D(app,r.state);
      else if(r.route==="clt")renderCLT(app,r.state);
      else if(r.route==="decision")renderDecision(app,r.state);
      else if(r.route==="tree")renderTree(app,r.state);
      else if(r.route==="queue")renderQueue(app,r.state);
      else renderHub(app);
    }
    window.addEventListener("hashchange",route);
    route();



</script>
  </body>
</html>
