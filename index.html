    function fcCompute(series,k,alpha){
      var n=series.length,i;
      var ma=[],wma=[],es=[],trend=[];
      var wsum=0;for(i=1;i<=k;i++)wsum+=i;
      var S=series[0];es.push(null);
      for(i=1;i<n;i++){S=alpha*series[i]+(1-alpha)*S;es.push(S)}
      /* es[t] is the smoothed level after period t; the forecast FOR period t is es[t-1] — build forecast arrays aligned to period index */
      var fMA=[],fWMA=[],fES=[],fTR=[];
      var fit=ols(series.map(function(_,j){return j+1}),series);
      for(i=0;i<n;i++){
        fMA.push(i>=k?meanOf(series.slice(i-k,i)):null);
        if(i>=k){var sw=0,sv=0;for(var j=0;j<k;j++){var w=j+1;sv+=w*series[i-k+j];sw+=w}fWMA.push(sv/sw)}else fWMA.push(null);
        fES.push(i===0?null:(i===1?series[0]:es[i-1]));
        fTR.push(fit.intercept+fit.slope*(i+1));
      }
      function errs(F){
        var ae=0,se=0,ape=0,c=0;
        for(var i2=0;i2<n;i2++){if(F[i2]===null)continue;var e=series[i2]-F[i2];ae+=Math.abs(e);se+=e*e;ape+=Math.abs(e/series[i2]);c++}
        return c?{mad:ae/c,mse:se/c,mape:100*ape/c,n:c}:null;
      }
      var lastS=es[n-1];
      var fut={ma:[],wma:[],es:[],trend:[]};
      var lastK=series.slice(n-k),swm=0,svm=0;for(var j2=0;j2<k;j2++){svm+=(j2+1)*lastK[j2];swm+=j2+1}
      for(var hh=1;hh<=3;hh++){fut.ma.push(meanOf(lastK));fut.wma.push(svm/swm);fut.es.push(lastS);fut.trend.push(fit.intercept+fit.slope*(n+hh))}
      return{ma:fMA,wma:fWMA,es:fES,trend:fTR,errs:{ma:errs(fMA),wma:errs(fWMA),es:errs(fES),trend:errs(fTR)},fut:fut,trendFit:fit,lastS:lastS};
    }

        S.vals.forEach(function(val,i){
          var x=X(val);
          cv._sb.pts.push({x:x,i:i});
          ctx.fillStyle=acc;ctx.strokeStyle=cssVar("--surface");ctx.lineWidth=1.6;
          ctx.beginPath();ctx.arc(x,beamY-13,11,0,7);ctx.fill();ctx.stroke();
          ctx.fillStyle="#fff";ctx.font="bold 9.5px system-ui";ctx.fillText(fmt(val,Math.abs(val%1)>1e-9?1:0),x,beamY-9.5);ctx.font="11px ui-monospace,monospace";
        });
        /* fulcrum */
        var fx=X(st.mean);
        ctx.fillStyle=red;ctx.beginPath();ctx.moveTo(fx,beamY+3);ctx.lineTo(fx-13,beamY+30);ctx.lineTo(fx+13,beamY+30);ctx.closePath();ctx.fill();
        ctx.font="bold 11.5px system-ui";ctx.textAlign="center";ctx.fillText("mean = "+fmt(st.mean,2),fx,beamY+46);
        cv.setAttribute("aria-label","Balance beam. "+S.vals.length+" weights; the fulcrum at the mean, "+fmt(st.mean,2)+", balances torques of "+fmt(st.left,1)+" on each side. Median "+fmt(st.median,2)+".");
      }
      function drawHist(st){
        var cv=$("#sb-hist");if(!cv)return;
        var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
        var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),acc=cssVar("--accent"),amb=cssVar("--amber"),red=cssVar("--red");
        var dom=domain(),bw=Math.max(1,Math.round((dom[1]-dom[0])/14));
        var bins={},maxC=0;
        S.vals.forEach(function(v){var b=Math.floor(v/bw)*bw;bins[b]=(bins[b]||0)+1;if(bins[b]>maxC)maxC=bins[b]});
        var padL=36,padR=14,padT=14,padB=30,pw=W-padL-padR,ph=H-padT-padB;
        function X(v){return padL+pw*(v-dom[0])/(dom[1]-dom[0])}
        ctx.clearRect(0,0,W,H);ctx.font="11px ui-monospace,monospace";ctx.fillStyle=axis;ctx.strokeStyle=grid;
        for(var g=0;g<=Math.max(1,maxC);g++){var y=padT+ph-ph*g/Math.max(1,maxC);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+pw,y);ctx.stroke();ctx.textAlign="right";ctx.fillText(g,padL-6,y+4)}
        Object.keys(bins).forEach(function(b){var bb=+b,c=bins[b];ctx.fillStyle=acc;ctx.globalAlpha=.8;
          ctx.fillRect(X(bb)+1,padT+ph-ph*c/Math.max(1,maxC),Math.max(2,X(bb+bw)-X(bb)-2),ph*c/Math.max(1,maxC));ctx.globalAlpha=1});
        function mark(v,color,dash,label,dy){
          ctx.strokeStyle=color;ctx.lineWidth=2.2;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(X(v),padT);ctx.lineTo(X(v),padT+ph);ctx.stroke();ctx.setLineDash([]);
          ctx.fillStyle=color;ctx.font="bold 11px system-ui";ctx.textAlign="left";ctx.fillText(label,X(v)+4,padT+11+dy);ctx.font="11px ui-monospace,monospace";
        }
        mark(st.mean,red,[],"mean",0);
        mark(st.median,amb,[5,4],"median",13);
        st.modes.forEach(function(m){mark(m,acc,[2,3],"mode",26)});
        ctx.fillStyle=axis;ctx.textAlign="center";ctx.fillText("value →",padL+pw/2,H-4);
      }
      var cvB=$("#sb-beam");
      function ptrVal(e){var r=cvB.getBoundingClientRect();return cvB._sb?cvB._sb.invX(e.clientX-r.left):null}
      cvB.addEventListener("pointerdown",function(e){
        if(!cvB._sb)return;var r=cvB.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
        var best=-1,bd=1e9;
        cvB._sb.pts.forEach(function(p){var d=Math.abs(p.x-px);if(d<bd){bd=d;best=p.i}});
        if(best>=0&&bd<34){dragIdx=best;cvB.setPointerCapture(e.pointerId)}
      });
      cvB.addEventListener("pointermove",function(e){
        if(dragIdx<0)return;var v=ptrVal(e);if(v===null)return;

      cvB.addEventListener("pointerup",function(){dragIdx=-1});
      cvB.addEventListener("pointercancel",function(){dragIdx=-1});
      $("#sb-vals").addEventListener("input",function(){sync(true)});
      $("#sb-outlier").addEventListener("click",function(){S.vals.push(30);$("#sb-vals").value=S.vals.join(", ");sync(false)});
      $("#sb-reset").addEventListener("click",function(){S.vals=[2,3,3,7,10];$("#sb-vals").value=S.vals.join(", ");sync(false)});
      sync(false);
      window.addEventListener("resize",function(){if(document.getElementById("sb-beam"))sync(false)});
    }

          boxplot(H*0.32,W*0.25,W*0.45,W*0.68,W*0.1,W*0.9);boxplot(H*0.72,W*0.35,W*0.55,W*0.75,W*0.22,W*0.97);ctx.fillStyle=cssVar("--red");ctx.beginPath();ctx.arc(W*0.97,H*0.32,2.6,0,7);ctx.fill()}},

    function renderPlotCompass(app,state){

      var h=toolHead("Probability & Statistics","Plot Compass — Choose a Chart",
        "Choose a chart with purpose: understand the structure of your variables, decide what the audience should notice, and the compass points. Below: the levels of measurement that constrain everything, a two-question recommender with live examples, and a chart atlas.",
        "Match a dataset and a message to a chart type, using levels of measurement and intent — and name the failure mode of the chart you pick.",
        "What categorical and numeric variables are; reading basic charts.","About 15 minutes.");
      h+='<section class="panel" style="margin-top:4px"><h2>First: levels of measurement</h2><p class="hint">The level of a variable determines what mathematics — and therefore which charts — it can honestly support. The levels nest: each allows everything the previous one allows, plus more.</p>'+
        '<div class="objbox" style="margin-bottom:0">'+

        '<div><h3>Interval</h3><p><strong>Evenly spaced, arbitrary zero</strong> — differences mean something, ratios do not. Allowed: + mean, standard deviation. <em>Calendar year, temperature in °C or °F.</em></p></div>'+
        '<div><h3>Ratio</h3><p><strong>Evenly spaced, true zero</strong> — “twice as much” makes sense. Allowed: everything, including ratios. <em>Height, age, goals scored, wait time.</em></p></div>'+
        '</div><p class="hint">Categorical variables name groups (nominal, ordinal); numeric variables count or measure (interval, ratio). Time is its own structure: it orders everything it touches.</p></section>';
      h+='<div class="layout" style="margin-top:20px"><div class="stack">';
      h+='<section class="panel"><h2>Answer two questions</h2>'+
        '<label class="fl" for="pc-struct">1 · What kind of variables do you have?</label><select id="pc-struct">'+
        '<option value="one-cat">One categorical variable</option><option value="one-num">One numeric variable</option><option value="two-num">Two numeric variables</option><option value="cat-num">Categorical + numeric</option><option value="two-cat">Two categorical variables</option><option value="time-num">Time + numeric</option></select>'+

        '<p class="hint">How to read the results: <strong>Best match</strong> = the most direct mapping to your goal. <strong>Strong option</strong> = valid, with trade-offs. <strong>Option</strong> = works under specific conditions.</p></section>';
      h+=teachBox("Step 2 · Check","Test the compass in your head",
        "A café chain records, for 24 orders: drink (nominal), size (ordinal), satisfaction (ordinal), wait minutes (ratio), order total (ratio), and date. To show whether larger sizes are associated with higher satisfaction, the compass should point to:",
        ["A pie chart of sizes","Grouped/stacked bars of size by satisfaction — two categorical variables, comparing composition","A histogram of wait minutes","A line chart over dates"],1,
        "Size and satisfaction are both categorical (ordinal), and the question is how the satisfaction mix shifts across sizes — a two-categorical comparison. Bars (grouped or 100% stacked) put the mix side by side; none of the numeric tools apply because neither variable is numeric.");

    function renderQuants(app,state){

        ["2.5 — a quarter of the way from 1 to 10 is 3.25, close enough","3.25 — position 1 + (10 − 1)(0.25) = 3.25, a quarter of the way from the 3rd value to the 4th","2.75","Exactly 3"],1,
        "Position rules differ between textbooks and software, which is why the rule must be stated with the answer. The interpolation rule used here (the common 'type 7') puts Q1 at sorted position 3.25 → 3 + 0.25×(4 − 3) = 3.25. The nearest-rank rule on the same data gives 3 — same data, different convention, both 'correct'.");

      h+='<section class="panel"><h2>From your data</h2>'+

        '<div class="row2"><div><label class="fl" for="qn-p">Percentile p (0–100)</label><input type="number" id="qn-p" step="any" min="0" max="100"></div>'+

        '<p class="hint">The box spans Q1 to Q3 (the middle half of the data); the line inside is the median; whiskers reach the farthest values inside the 1.5·IQR fences; dots beyond the fences are flagged outliers. The amber diamond is your requested percentile.</p></section>';
      h+='<section class="panel"><h2>From a normal distribution</h2>'+
        '<div class="row3"><div><label class="fl" for="qn-mu">Mean μ</label><input type="number" id="qn-mu" step="any"></div>'+
        '<div><label class="fl" for="qn-sd">Std dev σ</label><input type="number" id="qn-sd" step="any"></div>'+
        '<div><label class="fl" for="qn-np">Probability p (%)</label><input type="number" id="qn-np" step="any" min="0.1" max="99.9"></div></div>'+
        '<div id="qn-norm" class="readout" aria-live="polite" style="margin-top:8px"></div>'+
        '<canvas class="chart" id="qn-ncv" data-ratio="0.5" role="img" aria-label="Normal density with the area up to the requested quantile shaded"></canvas>'+
        '<p class="hint">Check it: μ = 100, σ = 15, p = 97.5% → z = 1.960 and the quantile is 129.40 — the top edge of the classic 95% range.</p></section>';
      h+=teachBox("Step 3 · Check","Check yourself",
        "A student scores at the 90th percentile of a test. A classmate concludes 'she answered 90% of the questions correctly.' The error:",
        ["None — percentile means percent correct","Percentile is a rank, not a score: she scored at or above 90% of the group. Her raw score could be 62% correct on a hard test — or 95% on an easy one","Percentiles only apply to normal data","The 90th percentile means 90 students beat her"],1,
        "Percentiles locate a value inside a reference group; percent-correct locates it against the maximum possible score. The two coincide only by accident. This is also why percentile-based cutoffs (top 10% admitted) move with the group's strength while raw cutoffs do not.");

      function sync(){
        S.data=$("#qn-data").value;S.p=Math.min(100,Math.max(0,parseFloat($("#qn-p").value)||0));S.method=$("#qn-method").value;
        S.mu=parseFloat($("#qn-mu").value)||0;S.sd=Math.max(0.0001,parseFloat($("#qn-sd").value)||1);S.np=Math.min(99.9,Math.max(0.1,parseFloat($("#qn-np").value)||50));
        setHash("quants",S);
        var data=parseNums(S.data).sort(function(a,b){return a-b}),n=data.length;
        var steps=$("#qn-steps"),sum=$("#qn-sum");
        if(n<2){steps.innerHTML="Enter at least two values.";sum.innerHTML="";return}
        var p01=S.p/100,val,pos,explain;
        if(S.method==="interp"){
          pos=1+(n-1)*p01;
          val=quantile7(data,p01);
          var loI=Math.floor(pos),frac=pos-loI;
          explain='Sorted position = 1 + (n − 1)·p = 1 + '+(n-1)+' × '+fmt(p01,3)+' = <strong>'+fmt(pos,3)+'</strong>. '+(frac<1e-12||loI>=n?'That lands exactly on sorted value #'+Math.min(n,Math.round(pos))+'.':'That is '+fmt(frac*100,0)+'% of the way from sorted value #'+loI+' ('+fmt(data[loI-1],3)+') to #'+(loI+1)+' ('+fmt(data[loI],3)+').');
        }else{
          var rank=Math.max(1,Math.ceil(p01*n));val=data[rank-1];pos=rank;
          explain='Rank = ⌈p · n⌉ = ⌈'+fmt(p01,3)+' × '+n+'⌉ = <strong>'+rank+'</strong>, so the percentile is the '+rank+'-th smallest value.';
        }
        steps.innerHTML='The <strong>'+fmt(S.p,1)+'th percentile</strong> of the '+n+' sorted values is <strong>'+fmt(val,4)+'</strong>.<br>'+explain;
        var q1=quantile7(data,0.25),med=quantile7(data,0.5),q3=quantile7(data,0.75),iqr=q3-q1;
        var loF=q1-1.5*iqr,hiF=q3+1.5*iqr;
        var outs=data.filter(function(v){return v<loF||v>hiF});
        sum.innerHTML='<div class="statgrid">'+
          '<div><div class="v">'+fmt(data[0],2)+'</div><div class="k">Minimum</div></div>'+
          '<div><div class="v">'+fmt(q1,2)+'</div><div class="k">Q1 (25th)</div></div>'+
          '<div><div class="v">'+fmt(med,2)+'</div><div class="k">Median</div></div>'+
          '<div><div class="v">'+fmt(q3,2)+'</div><div class="k">Q3 (75th)</div></div>'+
          '<div><div class="v">'+fmt(data[n-1],2)+'</div><div class="k">Maximum</div></div>'+
          '<div><div class="v">'+fmt(iqr,2)+'</div><div class="k">IQR</div></div></div>'+
          '<p class="readout" style="margin-top:8px">Fences: ['+fmt(loF,2)+', '+fmt(hiF,2)+']. '+(outs.length?'Outliers beyond the fences: <strong>'+outs.map(function(v){return fmt(v,2)}).join(", ")+'</strong>.':'No outliers beyond the fences.')+' Starter-data check: Q1 = 3.25, median 5.5, Q3 = 7.75.</p>';
        drawBox(data,q1,med,q3,loF,hiF,val);
        drawNorm();
      }
      function drawBox(data,q1,med,q3,loF,hiF,pval){
        var cv=$("#qn-box");if(!cv)return;
        var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
        var ink=cssVar("--ink"),axis=cssVar("--chart-axis"),acc=cssVar("--accent"),amb=cssVar("--amber"),red=cssVar("--red");
        var lo=Math.min(data[0],loF),hi=Math.max(data[data.length-1],hiF),pad=(hi-lo)*0.08||1;lo-=pad;hi+=pad;
        var padL=30,padR=30,pw=W-padL-padR,cy=H/2;
        function X(v){return padL+pw*(v-lo)/(hi-lo)}
        ctx.clearRect(0,0,W,H);ctx.font="11px ui-monospace,monospace";ctx.fillStyle=axis;
        var wLo=data.filter(function(v){return v>=loF})[0],wHi=data.filter(function(v){return v<=hiF}).pop();
        ctx.strokeStyle=ink;ctx.lineWidth=1.6;
        ctx.beginPath();ctx.moveTo(X(wLo),cy);ctx.lineTo(X(wHi),cy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(X(wLo),cy-8);ctx.lineTo(X(wLo),cy+8);ctx.moveTo(X(wHi),cy-8);ctx.lineTo(X(wHi),cy+8);ctx.stroke();
        ctx.fillStyle=acc;ctx.globalAlpha=.25;ctx.fillRect(X(q1),cy-22,X(q3)-X(q1),44);ctx.globalAlpha=1;
        ctx.strokeRect(X(q1),cy-22,X(q3)-X(q1),44);
        ctx.strokeStyle=red;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(X(med),cy-22);ctx.lineTo(X(med),cy+22);ctx.stroke();ctx.lineWidth=1.6;
        data.forEach(function(v){if(v<loF||v>hiF){ctx.fillStyle=red;ctx.beginPath();ctx.arc(X(v),cy,3.4,0,7);ctx.fill()}});
        /* percentile diamond */
        ctx.fillStyle=amb;ctx.beginPath();ctx.moveTo(X(pval),cy-34);ctx.lineTo(X(pval)+7,cy-26);ctx.lineTo(X(pval),cy-18);ctx.lineTo(X(pval)-7,cy-26);ctx.closePath();ctx.fill();
        ctx.fillStyle=axis;ctx.textAlign="center";
        [data[0],q1,med,q3,data[data.length-1]].forEach(function(v){ctx.fillText(fmt(v,Math.abs(v%1)>1e-9?1:0),X(v),H-8)});
        ctx.textAlign="left";ctx.fillStyle=amb;ctx.font="bold 11px system-ui";ctx.fillText("p = "+fmt(S.p,0),X(pval)+9,cy-24);ctx.font="11px ui-monospace,monospace";
        cv.setAttribute("aria-label","Box plot. Q1 "+fmt(q1,2)+", median "+fmt(med,2)+", Q3 "+fmt(q3,2)+", IQR "+fmt(q3-q1,2)+". The "+fmt(S.p,0)+"th percentile is "+fmt(pval,2)+".");
      }
      function drawNorm(){
        var cv=$("#qn-ncv");if(!cv)return;
        var z=normInv(S.np/100),val=S.mu+z*S.sd;
        $("#qn-norm").innerHTML='z for p = '+fmt(S.np,1)+'% is <strong>'+fmt(z,3)+'</strong>, so the quantile is μ + zσ = '+fmt(S.mu,2)+' + '+fmt(z,3)+' × '+fmt(S.sd,2)+' = <strong>'+fmt(val,3)+'</strong>. In words: '+fmt(S.np,1)+'% of the distribution lies at or below '+fmt(val,3)+'.';
        var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
        var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),acc=cssVar("--accent"),amb=cssVar("--amber");
        var x0=S.mu-4*S.sd,x1=S.mu+4*S.sd;
        var padL=44,padR=12,padT=12,padB=30,pw=W-padL-padR,ph=H-padT-padB;
        var maxD=normPdf(S.mu,S.mu,S.sd)*1.12;
        function X(x){return padL+pw*(x-x0)/(x1-x0)} function Y(d){return padT+ph-ph*d/maxD}
        ctx.clearRect(0,0,W,H);ctx.font="11px ui-monospace,monospace";ctx.fillStyle=axis;ctx.strokeStyle=grid;
        for(var g=0;g<=4;g++){var gy=maxD*g/4,y=Y(gy);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+pw,y);ctx.stroke();ctx.textAlign="right";ctx.fillText(fmt(gy,2),padL-6,y+4)}
        ctx.beginPath();ctx.moveTo(X(x0),Y(0));
        for(var i=0;i<=200;i++){var x=x0+(x1-x0)*i/200;if(x>val)break;ctx.lineTo(X(x),Y(normPdf(x,S.mu,S.sd)))}
        ctx.lineTo(X(Math.min(val,x1)),Y(0));ctx.closePath();ctx.fillStyle=amb;ctx.globalAlpha=.45;ctx.fill();ctx.globalAlpha=1;
        ctx.strokeStyle=acc;ctx.lineWidth=2;ctx.beginPath();
        for(var j=0;j<=200;j++){var x2=x0+(x1-x0)*j/200;if(j===0)ctx.moveTo(X(x2),Y(normPdf(x2,S.mu,S.sd)));else ctx.lineTo(X(x2),Y(normPdf(x2,S.mu,S.sd)))}
        ctx.stroke();ctx.lineWidth=1;
        ctx.strokeStyle=cssVar("--red");ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(X(val),padT);ctx.lineTo(X(val),padT+ph);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle=axis;ctx.textAlign="center";
        for(var gx=0;gx<=4;gx++){var xv=x0+(x1-x0)*gx/4;ctx.fillText(fmt(xv,Math.abs(xv%1)>1e-9?1:0),X(xv),H-14)}
        ctx.fillText("value →",padL+pw/2,H-2);
        cv.setAttribute("aria-label","Normal density with mean "+fmt(S.mu,1)+" and standard deviation "+fmt(S.sd,1)+". The area up to "+fmt(val,2)+" is "+fmt(S.np,1)+" percent.");
      }
      ["qn-data","qn-p","qn-method","qn-mu","qn-sd","qn-np"].forEach(function(id){$("#"+id).addEventListener("input",sync);$("#"+id).addEventListener("change",sync)});
      sync();
      window.addEventListener("resize",function(){if(document.getElementById("qn-box"))sync()});
    }

    /* ================= PROBLY ================= */
    function renderProbly(app,state){
      var S=Object.assign({p:0.5,label:"Coin flip — heads",trials:1000,ntries:4,seed:11},state||{});
      var PRESETS=[
        {label:"Coin flip — heads",p:0.5},{label:"One face of a die",p:1/6},{label:"Snake eyes (two dice)",p:1/36},
        {label:"An ace from a full deck",p:4/52},{label:"Two dice sum to 7",p:6/36},{label:"Birthday match among 23 people",p:0.507297},
        {label:"1 in 1,000",p:0.001},{label:"1 in 1,000,000",p:0.000001}
      ];
      var h=toolHead("Probability & Statistics","Probly — See the Odds",
        "Probabilities are hard to feel. 0.1667 is a decimal; 'one face of a die' is an experience. Probly translates any probability three ways — as a field of dots you can count, as '1 in X', and as odds — then stress-tests it with simulated trials and answers the question everyone actually asks: how likely is at least one success if I try n times?",
        "Translate fluently between probability, odds, and '1 in X'; use a frequency picture to judge a probability's size; and compute the chance of at least one success in n independent tries.",
        "Fractions and percentages; independence of trials.","About 10 minutes.");
      h+=teachBox("Step 1 · Predict","Before you roll",
        "You roll a fair die four times, hoping for at least one six. Your chance is:",
        ["4 × 1/6 ≈ 67% — four tries, four chances","1 − (5/6)⁴ ≈ 51.8% — one minus the chance of missing every time","Exactly 50%","1/6 — each roll is the same, so the chance cannot grow"],1,
        "Adding 1/6 four times double-counts the worlds where two sixes appear. The clean route is the complement: P(at least one) = 1 − P(none) = 1 − (5/6)⁴ = 1 − 0.4823 = 0.5177. Set Probly to a die face and n = 4 below and read it off.");
      h+='<div class="layout" style="margin-top:20px"><div class="stack">';
      h+='<section class="panel"><h2>Pick a probability</h2>'+
        '<div class="btnrow" style="margin:0 0 10px" id="pb-presets">'+PRESETS.map(function(pr,i){return '<button type="button" class="chip" data-i="'+i+'" aria-pressed="'+(Math.abs(S.p-pr.p)<1e-15)+'">'+esc(pr.label)+'</button>'}).join("")+'</div>'+
        '<label class="fl" for="pb-pct">Probability: <strong id="pb-pctlab"></strong></label><input type="range" id="pb-pct" min="0" max="100" step="0.1">'+
        '<div class="row2"><div><label class="fl" for="pb-pctn">Percent (%)</label><input type="number" id="pb-pctn" step="any" min="0" max="100"></div>'+
        '<div><label class="fl" for="pb-onein">Or “1 in X” — set X</label><input type="number" id="pb-onein" step="any" min="1"></div></div>'+
        '<p class="hint">Tiny probabilities (below 0.1%) are easier to set with the 1-in-X box or a preset.</p></section>';
      h+='<section class="panel"><h2>At least one success?</h2>'+
        '<label class="fl" for="pb-n">Number of independent tries n</label><input type="number" id="pb-n" step="1" min="1">'+
        '<div id="pb-atleast" class="readout" aria-live="polite"></div></section>';
      h+='<section class="panel"><h2>Stress-test it — simulated trials</h2>'+
        '<label class="fl" for="pb-trials">Trials to simulate</label><input type="number" id="pb-trials" step="100" min="10">'+
        '<div class="btnrow"><button type="button" class="btn small" id="pb-sim">Run trials</button></div>'+
        '<div id="pb-simout" class="readout" aria-live="polite" style="margin-top:8px">Not run yet. Simulation uses a seeded stream — the same seed replays the same trials, and each Run advances the seed.</div></section>';
      h+='</div><div class="stack">';
      h+='<section class="panel"><h2>The same probability, four ways</h2><div id="pb-ways" aria-live="polite"></div></section>';
      h+='<section class="panel"><h2>See it</h2><canvas class="chart" id="pb-cv" data-ratio="0.52" role="img" aria-label="Field of dots with the expected share highlighted"></canvas><div id="pb-cap" class="readout"></div></section>';
      h+=teachBox("Step 3 · Check","Check yourself",
        "An event has probability 1/6. A friend says 'the odds are 1 to 6.' Correct them:",
        ["They are right; odds and probability are the same numbers","Odds compare success to failure: 1/6 probability means 1 success against 5 failures in the long run — odds of 1 : 5 in favor (5 : 1 against). '1 to 6' would be probability 1/7","Odds are always larger than probabilities","Odds only exist in gambling"],1,
        "Probability = successes / all outcomes (1 of 6). Odds = successes : failures (1 : 5). Confusing them overstates the chance — and the confusion is profitable for whoever sets the payout, which is why the distinction survives every attempt to blur it.");
      h+='</div></div>';
      app.innerHTML=h;
      function fmtP(p){
        if(p>=0.01)return fmt(100*p,2)+"%";
        if(p>=0.0001)return fmt(100*p,4)+"%";
        return fmt(100*p,6)+"%";
      }
      function sync(){
        S.p=Math.min(1,Math.max(0,S.p));
        setHash("probly",S);
        $("#pb-pct").value=100*S.p;$("#pb-pctn").value=+((100*S.p).toFixed(6));
        $("#pb-pctlab").textContent=fmtP(S.p);
        $$("#pb-presets .chip").forEach(function(ch){var pr=PRESETS[+ch.dataset.i];ch.setAttribute("aria-pressed",Math.abs(S.p-pr.p)<1e-12)});
        var oneIn=S.p>0?1/S.p:Infinity;
        var oddsTxt;
        if(S.p<=0)oddsTxt="0 : 1 — it cannot happen";
        else if(S.p>=1)oddsTxt="certain — it cannot fail";
        else{var of=S.p/(1-S.p);oddsTxt=of>=1?fmt(of,2)+" : 1 in favor":"1 : "+fmt(1/of,2)+" (i.e. "+fmt(1/of,2)+" : 1 against)"}
        $("#pb-ways").innerHTML='<div class="statgrid">'+
          '<div><div class="v">'+fmtP(S.p)+'</div><div class="k">Probability</div></div>'+
          '<div><div class="v">'+(isFinite(oneIn)?"1 in "+(oneIn>=100?fmt(oneIn,0):fmt(oneIn,2)):"—")+'</div><div class="k">Frequency phrasing</div></div>'+
          '<div><div class="v" style="font-size:16px;padding-top:4px">'+oddsTxt+'</div><div class="k">Odds</div></div>'+
          '<div><div class="v">'+fmt(S.p,4)+'</div><div class="k">As a decimal</div></div></div>'+
          '<p class="readout" style="margin-top:8px">Event: <strong>'+esc(S.label)+'</strong>. In 1,000 independent tries you would expect about <strong>'+fmt(1000*S.p,1000*S.p<10?1:0)+'</strong> successes — on average, not on schedule.</p>';
        var n=Math.max(1,parseInt($("#pb-n").value)||1);S.ntries=n;
        var pa=1-Math.pow(1-S.p,n);
        $("#pb-atleast").innerHTML='<p style="margin:0">P(at least one success in '+n+' tries) = 1 − (1 − p)<sup>'+n+'</sup> = <strong>'+fmtP(pa)+'</strong>.</p>'+
          '<div class="tbar" style="margin-top:8px;height:14px"><i style="left:0;width:'+(100*pa)+'%"></i></div>'+
          (S.p>0&&pa<0.999?'<p class="hint">To reach a 50% chance of at least one success takes about '+Math.ceil(Math.log(0.5)/Math.log(1-S.p))+' tries at this probability.</p>':"");
        drawWaffle();
      }
      function drawWaffle(){
        var cv=$("#pb-cv");if(!cv)return;
        var N=S.p>=0.004?100:1000;
        var filled=Math.round(S.p*N);
        var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
        var acc=cssVar("--accent"),axis=cssVar("--chart-axis");
        var cols=N===100?10:40,rows=N/cols;
        var cell=Math.min((W-16)/cols,(H-16)/rows),r=cell*0.36;
        var ox=(W-cell*cols)/2,oy=(H-cell*rows)/2;
        ctx.clearRect(0,0,W,H);
        for(var i=0;i<N;i++){
          var cx=ox+cell*(i%cols)+cell/2,cyy=oy+cell*Math.floor(i/cols)+cell/2;
          ctx.beginPath();ctx.arc(cx,cyy,r,0,7);
          if(i<filled){ctx.fillStyle=acc;ctx.fill()}else{ctx.fillStyle=axis;ctx.globalAlpha=.3;ctx.fill();ctx.globalAlpha=1}
        }
        $("#pb-cap").innerHTML='<p style="margin:0">Each dot is one of <strong>'+N+'</strong> equally likely outcomes; <strong>'+filled+'</strong> are highlighted — the count is the probability times '+N+', rounded, so the picture is exact only when the probability divides the field evenly. The number above never rounds.</p>';
        cv.setAttribute("aria-label","A field of "+N+" dots, "+filled+" highlighted, representing a probability of "+fmtP(S.p)+".");
      }
      $$("#pb-presets .chip").forEach(function(ch){ch.addEventListener("click",function(){var pr=PRESETS[+ch.dataset.i];S.p=pr.p;S.label=pr.label;sync()})});
      $("#pb-pct").addEventListener("input",function(){S.p=+this.value/100;S.label="Custom probability";sync()});
      $("#pb-pctn").addEventListener("input",function(){var v=parseFloat(this.value);if(isFinite(v)){S.p=v/100;S.label="Custom probability";sync()}});
      $("#pb-onein").addEventListener("input",function(){var v=parseFloat(this.value);if(isFinite(v)&&v>=1){S.p=1/v;S.label="Custom probability (1 in "+fmt(v,0)+")";sync()}});
      $("#pb-n").addEventListener("input",sync);
      $("#pb-sim").addEventListener("click",function(){
        var trials=Math.max(10,parseInt($("#pb-trials").value)||1000);S.trials=trials;S.seed=(S.seed||11)+1;
        var rnd=mulberry32(S.seed>>>0),hits=0;
        for(var i=0;i<trials;i++)if(rnd()<S.p)hits++;
        var obs=hits/trials;
        $("#pb-simout").innerHTML='Seed '+S.seed+': <strong>'+hits+'</strong> successes in '+trials+' trials — observed frequency <strong>'+fmtP(obs)+'</strong> against an expected '+fmt(trials*S.p,1)+' successes ('+fmtP(S.p)+'). '+(Math.abs(obs-S.p)<=2*Math.sqrt(S.p*(1-S.p)/trials)?'Well inside ordinary sampling noise (±2 standard errors ≈ ±'+fmtP(2*Math.sqrt(S.p*(1-S.p)/trials))+').':'A bit far out — possible, but worth another run to see it regress.')+' Run again to watch the frequency wander around the probability, closing in as trials grow.';
        setHash("probly",S);
      });
      $("#pb-n").value=S.ntries;$("#pb-trials").value=S.trials;
      sync();
      window.addEventListener("resize",function(){if(document.getElementById("pb-cv"))drawWaffle()});
    }

    /* ================= ROUTER ================= */
    function parseHash(){
      var h=location.hash.replace(/^#\/?/,"");var parts=h.split("?");var route=parts[0]||"";
      var state=null;if(parts[1]){var m=parts[1].match(/(?:^|&)s=([^&]+)/);if(m)state=decState(decodeURIComponent(m[1]))}
      return{route:route,state:state};
    }
    function route(){
      var r=parseHash(),app=$("#app");
      $$(".topnav a").forEach(function(a){if(a.dataset.nav===r.route)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
      window.scrollTo(0,0);
      if(r.route==="lp")renderLP(app,r.state);
      else if(r.route==="sensitivity")renderSens(app,r.state);
      else if(r.route==="lp3d")renderLP3D(app,r.state);
      else if(r.route==="clt")renderCLT(app,r.state);
      else if(r.route==="decision")renderDecision(app,r.state);
      else if(r.route==="tree")renderTree(app,r.state);
      else if(r.route==="queue")renderQueue(app,r.state);
      else if(r.route==="pairwise")renderPairwise(app,r.state);
      else if(r.route==="nextinline")renderNextInLine(app,r.state);
      else if(r.route==="levelcurves")renderLevelCurves(app,r.state);
      else if(r.route==="hiker")renderHiker(app,r.state);
      else if(r.route==="linear")renderLinear(app,r.state);
      else if(r.route==="distributions")renderDistributions(app,r.state);
      else if(r.route==="regression")renderRegression(app,r.state);
      else if(r.route==="forecasting")renderForecasting(app,r.state);
      else if(r.route==="statbalance")renderStatBalance(app,r.state);
      else if(r.route==="plotcompass")renderPlotCompass(app,r.state);
      else if(r.route==="quants")renderQuants(app,r.state);
      else if(r.route==="probly")renderProbly(app,r.state);
      else renderHub(app);
    }
    window.addEventListener("hashchange",route);
    route();



</script>
  </body>
