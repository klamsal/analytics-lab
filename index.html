<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Analytics Lab — Decision Modeling Tools</title>
    <style>
      :root{
        --bg:#f7f4ee; --bg2:#efe9dd; --surface:#fffdf8; --surface2:#f3eee2;
        --ink:#1d2733; --ink2:#46536a; --ink3:#6b7790;
        --line:#ddd3bf; --line2:#c9bda1;
        --accent:#0e6b5c; --accent-ink:#0a5547; --accent-soft:#dcefe9;
        --amber:#b45309; --amber-soft:#fbeed3;
        --red:#b3261e; --red-soft:#fbe3e1;
        --good:#0e6b5c; --good-soft:#dcefe9;
        --chart-grid:#d8d0bd; --chart-axis:#8a8268;
        --shadow:0 1px 2px rgba(40,32,10,.06),0 6px 18px rgba(40,32,10,.07);
        --radius:10px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#12161d; --bg2:#171c26; --surface:#1b212d; --surface2:#222a38;
          --ink:#e8e6df; --ink2:#b6bdc9; --ink3:#8d97a8;
          --line:#333d4f; --line2:#46536a;
          --accent:#3ec9ae; --accent-ink:#7fe0cb; --accent-soft:#173b34;
          --amber:#f0b45a; --amber-soft:#3d2f14;
          --red:#ff9d94; --red-soft:#42201d;
          --good:#3ec9ae; --good-soft:#173b34;
          --chart-grid:#2c3547; --chart-axis:#6d7889;
          --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
        }
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{margin:0;background:var(--bg);color:var(--ink);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        font-size:16px;line-height:1.5}
      .serif{font-family:"Iowan Old",Palatino,"Palatino Linotype",Georgia,serif}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      a{color:var(--accent-ink)}
      :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
      button{font:inherit;cursor:pointer}
      input,select{font:inherit;color:var(--ink)}
      .wrap{max-width:1180px;margin:0 auto;padding:0 18px 64px}

      /* ---------- top bar ---------- */
      .topbar{border-bottom:1px solid var(--line);background:var(--bg2)}
      .topbar-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
      .brand{font-family:"Iowan Old",Palatino,Georgia,serif;font-weight:700;font-size:19px;color:var(--ink);text-decoration:none;letter-spacing:.01em}
      .brand span{color:var(--accent-ink)}
      .topnav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
      .topnav a{color:var(--ink2);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:8px}
      .topnav a:hover{background:var(--surface2);color:var(--ink)}
      .topnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

      /* ---------- hub ---------- */
      .hero{padding:38px 0 8px}
      .hero h1{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:clamp(28px,4.6vw,42px);line-height:1.12;margin:0 0 10px;font-weight:700;max-width:20em}
      .hero p{color:var(--ink2);max-width:44em;margin:0;font-size:17px}
      .hub-tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 6px;align-items:center}
      .searchbox{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:0 12px}
      .searchbox input{border:0;background:transparent;padding:11px 0;width:100%;outline:none}
      .chip{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:14px}
      .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
      @media (prefers-color-scheme: dark){.chip[aria-pressed="true"]{color:#0c1714}}
      .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;margin-top:18px}
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
      .card:hover{border-color:var(--accent)}
      .card .cat{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
      .card h2{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:21px;margin:0;line-height:1.25}
      .card p{margin:0;color:var(--ink2);font-size:14.5px}
      .card .meta{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--ink3);display:flex;justify-content:space-between;gap:8px}
      .card .go{color:var(--accent-ink);font-weight:600;white-space:nowrap}
      .roadmap{margin-top:36px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
      .roadmap h2{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:19px;margin:0 0 6px}
      .roadmap p{margin:0 0 8px;color:var(--ink2);font-size:14.5px}
      .roadmap ul{margin:0;padding-left:20px;color:var(--ink2);font-size:14.5px;columns:2;column-gap:32px}
      @media (max-width:640px){.roadmap ul{columns:1}}
      .noresults{color:var(--ink2);padding:24px 0}

      /* ---------- tool shell ---------- */
      .backlink{display:inline-block;margin:20px 0 4px;font-size:14px;text-decoration:none}
      .toolhead h1{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:clamp(26px,4vw,36px);margin:2px 0 6px;line-height:1.15}
      .toolhead .cat{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
      .toolhead p.sub{color:var(--ink2);margin:0 0 12px;max-width:46em}
      .objbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0 20px}
      .objbox>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
      .objbox h3{margin:0 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
      .objbox p{margin:0;font-size:14.5px;color:var(--ink2)}
      .layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
      @media (max-width:900px){.layout{grid-template-columns:1fr}}
      .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
      .panel h2{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:19px;margin:0 0 10px}
      .panel h3{font-size:15px;margin:16px 0 6px}
      .panel h3:first-of-type{margin-top:4px}
      .stack{display:flex;flex-direction:column;gap:20px;min-width:0}
      fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 14px;padding:10px 12px 12px}
      legend{font-size:13px;font-weight:700;color:var(--ink2);padding:0 4px}
      label.fl{display:block;font-size:13.5px;font-weight:600;margin:10px 0 4px}
      label.fl:first-child{margin-top:0}
      .hint{font-size:12.5px;color:var(--ink3);font-weight:400}
      input[type="number"],input[type="text"],select{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
      input[type="range"]{width:100%;accent-color:var(--accent);padding:6px 0}
      .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
      .btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:15px;text-decoration:none}
      @media (prefers-color-scheme: dark){.btn{color:#0c1714}}
      .btn.secondary{background:transparent;color:var(--accent-ink)}
      .btn.small{padding:6px 11px;font-size:13.5px}
      .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
      canvas.chart{width:100%;height:auto;display:block;background:var(--surface)}
      .readout{font-size:14.5px;color:var(--ink2)}
      .readout strong{color:var(--ink)}
      .bigstat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 2px}
      .bigstat div{min-width:110px}
      .bigstat .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:700;color:var(--ink)}
      .bigstat .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
      table.data{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
      table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right}
      table.data th:first-child,table.data td:first-child{text-align:left}
      table.data th{color:var(--ink2);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
      table.data td.num,table.data th.num{font-family:ui-monospace,Menlo,Consolas,monospace}
      tr.hl td{background:var(--accent-soft);font-weight:600}
      tr.out td{background:var(--red-soft)}
      .tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;vertical-align:1px}
      .tag.bind{background:var(--amber-soft);color:var(--amber)}
      .tag.ok{background:var(--good-soft);color:var(--good)}
      .tag.bad{background:var(--red-soft);color:var(--red)}
      .banner{border-radius:8px;padding:11px 14px;font-size:14.5px;margin:12px 0;border:1px solid}
      .banner.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
      .banner.bad{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
      .banner.good{background:var(--good-soft);border-color:var(--good);color:var(--ink)}

      /* predict / check */
      .teach{border:1px solid var(--line2);border-radius:var(--radius);padding:16px;background:var(--surface)}
      .teach .step{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
      .teach h2{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:19px;margin:2px 0 8px}
      .teach p.q{margin:0 0 10px;font-size:15px}
      .opts{display:flex;flex-direction:column;gap:8px}
      .opts label{display:flex;gap:9px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14.5px;cursor:pointer}
      .opts input{margin-top:3px;accent-color:var(--accent)}
      .feedback{margin-top:10px;font-size:14.5px;border-radius:8px;padding:10px 12px;display:none}
      .feedback.show{display:block}
      .feedback.right{background:var(--good-soft);border:1px solid var(--good)}
      .feedback.wrong{background:var(--red-soft);border:1px solid var(--red)}

      /* sensitivity sliders */
      .sensctl{border-bottom:1px solid var(--line);padding:10px 0}
      .sensctl:last-child{border-bottom:0}
      .sensctl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
      .sensctl .lab b{font-size:14.5px}
      .sensctl .pair{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center}
      .rangebar{position:relative;height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;margin-top:7px}
      .rangebar .zone{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.45;border-radius:6px}
      .rangebar .mark{position:absolute;top:-3px;width:3px;height:14px;background:var(--ink);border-radius:2px}
      .rangebar .mark.out{background:var(--red)}
      .rangebar-cap{font-size:12px;color:var(--ink3);margin-top:3px}
      /* tornado */
      .tornado{display:flex;flex-direction:column;gap:9px;margin-top:6px}
      .trow{display:grid;grid-template-columns:150px 1fr 86px;gap:10px;align-items:center;font-size:13.5px}
      @media (max-width:560px){.trow{grid-template-columns:104px 1fr 70px}}
      .tbar{position:relative;height:16px;background:var(--surface2);border-radius:4px}
      .tbar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:4px;opacity:.8}
      .trow .tv{font-family:ui-monospace,Menlo,Consolas,monospace;text-align:right}
      /* sensitivity lab (mirror layout) */
      .solstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:20px}
      @media(max-width:1000px){.solstrip{grid-template-columns:repeat(3,1fr)}}
      @media(max-width:520px){.solstrip{grid-template-columns:repeat(2,1fr)}}
      .ss .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;font-weight:700;color:var(--ink)}
      .ss .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
      .ss .v.pos{color:var(--good)} .ss .v.neg{color:var(--red)}
      .sens-grid{display:grid;gap:20px;margin-top:20px;align-items:start}
      @media(min-width:1200px){.sens-grid{grid-template-columns:1fr 1.5fr 1fr;grid-template-areas:"form model twod" "ctls model twod"}}
      @media(min-width:900px) and (max-width:1199.98px){.sens-grid{grid-template-columns:1fr 1.4fr;grid-template-areas:"form model" "ctls model" "twod twod"}}
      @media(max-width:899.98px){.sens-grid{grid-template-columns:1fr;grid-template-areas:"ctls" "model" "twod" "form"}}
      .ga-form{grid-area:form}.ga-ctls{grid-area:ctls}.ga-model{grid-area:model}.ga-twod{grid-area:twod}
      .panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
      .panelhead h2{margin:0}
      .formline{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;border:1px solid transparent;font-size:14px}
      .formline .flab{flex:0 0 104px;font-weight:700;color:var(--ink2);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
      .formline .feq{font-family:ui-monospace,Menlo,Consolas,monospace}
      .formline.active{background:var(--amber-soft);border-color:var(--amber)}
      .meter-lims{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:2px}
      .ctl-status{font-size:13px;font-weight:700;margin-top:5px}
      .ctl-status.in{color:var(--good)} .ctl-status.out{color:var(--red)}
      .legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:12.5px;color:var(--ink2)}
      .lgi{display:inline-flex;align-items:center;gap:6px}
      .lgi i{width:14px;height:4px;border-radius:2px;display:inline-block;flex:none}
      .lgi i.dot{width:9px;height:9px;border-radius:50%}
      .lgi i.ring{background:transparent;border:2px solid var(--chart-axis);width:6px;height:6px}
      canvas.cv3d{touch-action:none;cursor:grab}
      canvas.cv3d:active{cursor:grabbing}
      .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
      .report-grid>div{min-width:0}
      .sens-grid>*{min-width:0}
      @media(max-width:900px){.report-grid{grid-template-columns:1fr}}
      .tscroll{overflow-x:auto}
      .tree-wrap{overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:8px;min-height:340px}
      .tree-wrap svg{display:block;min-width:640px;width:100%;height:auto}
      .tnode{cursor:pointer}
      .tnode:focus{outline:none}
      .tnode:focus .tnode-box{stroke:var(--accent);stroke-width:3}
      .qchart-wrap{margin-top:6px}
      .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:8px}
      .statgrid>div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
      .statgrid .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;color:var(--ink)}
      .statgrid .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
      /* final-batch tools */
      .btn[aria-pressed="false"]{opacity:.5}
      .btn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
      .mtx td,.mtx th{padding:5px 6px}
      .mtx select{width:auto;padding:4px 6px;font-size:13.5px}
      .mtx input[type="text"]{padding:5px 7px;font-size:13.5px}
      .atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;margin-top:12px}
      .atlas .ac{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
      .atlas .ac h3{font-family:"Iowan Old",Palatino,Georgia,serif;font-size:16.5px;margin:0 0 4px}
      .atlas .ac p{margin:4px 0;font-size:13.5px;color:var(--ink2)}
      .atlas .ac p b{color:var(--ink)}
      .atlas canvas{width:100%;height:auto;display:block}
      .waffle-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}
      .simstage{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px}
      .stationrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
      footer.note{margin-top:44px;border-top:1px solid var(--line);padding-top:14px;color:var(--ink3);font-size:13.5px;max-width:52em}
      .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
      @media print{.topbar,.btnrow,.hub-tools{display:none}}
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-in">
        <a class="brand" href="#/">Analytics<span>Lab</span></a>
        <nav class="topnav" aria-label="Tools">
          <a href="#/lp" data-nav="lp">LP Explorer</a>
          <a href="#/sensitivity" data-nav="sensitivity">LP Sensitivity</a>
          <a href="#/lp3d" data-nav="lp3d">LP 3D</a>
          <a href="#/clt" data-nav="clt">CLT &amp; CI Lab</a>
          <a href="#/decision" data-nav="decision">Decision Lab</a>
          <a href="#/tree" data-nav="tree">Decision Tree</a>
          <a href="#/queue" data-nav="queue">Queuing Lab</a>
        </nav>
      </div>
    </div>
    <main class="wrap" id="app" tabindex="-1"></main>
    <script>
    "use strict";
    /* ================= utilities ================= */
    var $=function(s,r){return (r||document).querySelector(s)};
    var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
    function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstElementChild}
    function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
    function fmt(x,d){if(x===null||x===undefined||!isFinite(x))return "—";d=(d===undefined?2:d);return Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
    function fmt0(x){return fmt(x,0)}
    function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    function encState(o){try{return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(e){return ""}}
    function decState(s){try{return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))))}catch(e){return null}}
    function setHash(route,state){var h="#/"+route+(state?"?s="+encState(state):"");if(location.hash!==h)history.replaceState(null,"",h)}
    function dl(name,text){var b=new Blob([text],{type:"text/plain"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},400)}
    function fitCanvas(cv){var r=cv.getBoundingClientRect();var d=window.devicePixelRatio||1;var w=Math.max(300,Math.round(r.width));var h=Math.round(w*(cv.dataset.ratio?parseFloat(cv.dataset.ratio):0.68));cv.width=w*d;cv.height=h*d;cv.style.height=h+"px";var ctx=cv.getContext("2d");ctx.setTransform(d,0,0,d,0,0);return{ctx:ctx,W:w,H:h}}
    function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

    /* ================= shared LP core (2 variables) =================
       problem: {cx, cy, sense:'max'|'min', cons:[{a,b,op,rhs,name}]} plus x,y >= 0 */
    var OKTO={
      cx:4, cy:3, sense:"max",
      xname:"OktoValve masks (Xv)", yname:"OktoPrint masks (Xp)",
      cons:[
        {a:2,   b:0, op:"<=", rhs:1000, name:"C1 · Valves"},
        {a:2.5, b:1, op:"<=", rhs:1600, name:"C2 · Labor"},
        {a:2.7, b:3, op:"<=", rhs:2688, name:"C3 · Fabric"},
        {a:-1,  b:1, op:"<=", rhs:200,  name:"C4 · Print − Valve difference"},
        {a:1,   b:1, op:">=", rhs:100,  name:"C5 · Minimum commitment"}
      ]
    };
    function oktoCopy(){return JSON.parse(JSON.stringify(OKTO))}
    function satisfies(c,x,y,tol){var v=c.a*x+c.b*y;tol=tol||1e-7;if(c.op==="<=")return v<=c.rhs+tol;if(c.op===">=")return v>=c.rhs-tol;return Math.abs(v-c.rhs)<=tol}

      var xmax=10,ymax=10,i;

      function niceStep(m){var p=Math.pow(10,Math.floor(Math.log10(m)));var s=m/p;return (s<=1?1:s<=2?2:s<=2.5?2.5:s<=5?5:10)*p}

      ctx.textAlign="center";
      for(v=0;v<=xmax;v+=sx){ctx.beginPath();ctx.moveTo(X(v),padT);ctx.lineTo(X(v),padT+ph);ctx.stroke();ctx.fillText(fmt(v,v<10&&v%1?1:0),X(v),H-18)}

    }

    /* ================= LP SENSITIVITY LAB ================= */
    var CONCOLS=["#c2410c","#0369a1","#7c3aed","#be185d","#15803d","#a16207"];
    function trimNum(x){if(x===null||x===undefined||isNaN(x))return "—";if(!isFinite(x))return "1E+30";var s=fmt(x,4);s=s.replace(/(\.\d*?)0+$/,"$1").replace(/\.$/,"");return s}
    /* ---- 3D geometry: plain-canvas projection, drag rotate / wheel+pinch zoom ---- */
    function draw3D(cv,P,sol,baseOpt,view,activeCi){
      var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
      var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),ink=cssVar("--ink"),acc=cssVar("--accent"),red=cssVar("--red"),surf2=cssVar("--surface2");
      var XR=10,YR=10,i;
      P.cons.forEach(function(c){if(c.a>0)XR=Math.max(XR,c.rhs/c.a);if(c.b>0)YR=Math.max(YR,c.rhs/c.b)});
      sol.vertices.forEach(function(v){XR=Math.max(XR,v.x);YR=Math.max(YR,v.y)});
      if(sol.opt){XR=Math.max(XR,sol.opt.x);YR=Math.max(YR,sol.opt.y)}
      if(baseOpt){XR=Math.max(XR,baseOpt.x);YR=Math.max(YR,baseOpt.y)}
      XR=Math.min(XR*1.12,1e6);YR=Math.min(YR*1.12,1e6);
      var M=Math.max(XR,YR);
      var zmax=1;sol.vertices.forEach(function(v){zmax=Math.max(zmax,v.z)});if(baseOpt)zmax=Math.max(zmax,baseOpt.z);
      var zS=0.66*M/(zmax*1.08);
      var ca=Math.cos(view.az),sa=Math.sin(view.az),ce=Math.cos(view.el),se=Math.sin(view.el);
      var S=view.zoom*Math.min(W,H)/(1.62*M);
      function pr(x,y,z){
        var X=x-XR/2,Y=y-YR/2,Z=z*zS;
        var x1=X*ca-Y*sa,y1=X*sa+Y*ca;
        var z2=Z*ce-y1*se;
        return{x:W/2+x1*S,y:H*0.60-z2*S};
      }
      function line(a,b,style,w,dash){ctx.strokeStyle=style;ctx.lineWidth=w||1;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}
      function dot(p,r,fill,stroke){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.6;ctx.stroke()}}
      ctx.clearRect(0,0,W,H);
      /* floor */
      var f00=pr(0,0,0),f10=pr(XR,0,0),f11=pr(XR,YR,0),f01=pr(0,YR,0);
      ctx.beginPath();ctx.moveTo(f00.x,f00.y);ctx.lineTo(f10.x,f10.y);ctx.lineTo(f11.x,f11.y);ctx.lineTo(f01.x,f01.y);ctx.closePath();
      ctx.fillStyle=surf2;ctx.globalAlpha=.55;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=grid;ctx.lineWidth=1;ctx.stroke();
      function niceStep(m){var p=Math.pow(10,Math.floor(Math.log10(m)));var s=m/p;return (s<=1?1:s<=2?2:s<=2.5?2.5:s<=5?5:10)*p}
      var gx=niceStep(XR/4),gy=niceStep(YR/4),v;
      for(v=gx;v<XR;v+=gx)line(pr(v,0,0),pr(v,YR,0),grid,1);
      for(v=gy;v<YR;v+=gy)line(pr(0,v,0),pr(XR,v,0),grid,1);
      /* axes */
      line(pr(0,0,0),pr(XR,0,0),axis,1.6);line(pr(0,0,0),pr(0,YR,0),axis,1.6);line(pr(0,0,0),pr(0,0,zmax*1.08),axis,1.6);
      ctx.fillStyle=axis;ctx.font="bold 12px system-ui";ctx.textAlign="left";
      var lx=pr(XR,0,0);ctx.fillText("Xv",lx.x+5,lx.y+4);
      var ly=pr(0,YR,0);ctx.fillText("Xp",ly.x-6,ly.y-7);
      var lz=pr(0,0,zmax*1.08);ctx.fillText("Profit",lz.x-14,lz.y-8);
      /* feasible region on the floor */
      var poly=feasiblePolygon(P,XR,YR);
      if(poly.length>2){ctx.beginPath();poly.forEach(function(p,i2){var q=pr(p.x,p.y,0);if(i2===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=acc;ctx.globalAlpha=.20;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=acc;ctx.lineWidth=1.6;ctx.stroke()}
      /* constraint lines on the floor, in legend colors */
      function lineSeg(c){
        var pts=[];
        function add(x,y){if(x>=-1e-9&&x<=XR+1e-9&&y>=-1e-9&&y<=YR+1e-9){for(var k=0;k<pts.length;k++)if(Math.hypot(pts[k].x-x,pts[k].y-y)<1e-6)return;pts.push({x:Math.max(0,Math.min(XR,x)),y:Math.max(0,Math.min(YR,y))})}}
        if(Math.abs(c.b)>1e-12){add(0,c.rhs/c.b);add(XR,(c.rhs-c.a*XR)/c.b)}
        if(Math.abs(c.a)>1e-12){add(c.rhs/c.a,0);add((c.rhs-c.b*YR)/c.a,YR)}
        return pts.length>=2?[pts[0],pts[1]]:null;
      }
      P.cons.forEach(function(c,i2){var sg=lineSeg(c);if(sg)line(pr(sg[0].x,sg[0].y,0),pr(sg[1].x,sg[1].y,0),CONCOLS[i2%6],i2===activeCi?3.4:1.8)});
      /* faint full profit plane over the floor */
      var pc=[pr(0,0,0),pr(XR,0,P.cx*XR),pr(XR,YR,P.cx*XR+P.cy*YR),pr(0,YR,P.cy*YR)];
      ctx.beginPath();ctx.moveTo(pc[0].x,pc[0].y);for(i=1;i<4;i++)ctx.lineTo(pc[i].x,pc[i].y);ctx.closePath();
      ctx.fillStyle=acc;ctx.globalAlpha=.07;ctx.fill();ctx.globalAlpha=1;
      /* active constraint: translucent wall from its floor line up to the plane */
      if(activeCi!==null&&activeCi!==undefined&&poly.length>2){
        var ac2=P.cons[activeCi];
        for(i=0;i<poly.length;i++){var pA=poly[i],pB=poly[(i+1)%poly.length];
          if(Math.abs(ac2.a*pA.x+ac2.b*pA.y-ac2.rhs)<1e-4&&Math.abs(ac2.a*pB.x+ac2.b*pB.y-ac2.rhs)<1e-4){
            var w1=pr(pA.x,pA.y,0),w2=pr(pB.x,pB.y,0),w3=pr(pB.x,pB.y,objAt(P,pB.x,pB.y)),w4=pr(pA.x,pA.y,objAt(P,pA.x,pA.y));
            ctx.beginPath();ctx.moveTo(w1.x,w1.y);ctx.lineTo(w2.x,w2.y);ctx.lineTo(w3.x,w3.y);ctx.lineTo(w4.x,w4.y);ctx.closePath();
            ctx.fillStyle=CONCOLS[activeCi%6];ctx.globalAlpha=.16;ctx.fill();ctx.globalAlpha=1;break;
          }}
      }
      /* profit surface over the feasible region */
      if(sol.status==="optimal"&&poly.length>2){
        var cen={x:0,y:0};poly.forEach(function(p){cen.x+=p.x/poly.length;cen.y+=p.y/poly.length});
        var cTop=pr(cen.x,cen.y,objAt(P,cen.x,cen.y));
        for(i=0;i<poly.length;i++){
          var q1=pr(poly[i].x,poly[i].y,objAt(P,poly[i].x,poly[i].y));
          var pn=poly[(i+1)%poly.length],q2=pr(pn.x,pn.y,objAt(P,pn.x,pn.y));

        for(var i=0;i<D.alts.length;i++)for(var j=i+1;j<D.alts.length;j++){
          var prev=emvAt(i,varJ,0)-emvAt(j,varJ,0);
          for(var p=0.01;p<=1.0001;p+=0.01){var cur=emvAt(i,varJ,p)-emvAt(j,varJ,p);
            if(prev!==0&&cur!==0&&Math.sign(cur)!==Math.sign(prev)){var a2=p-0.01,b2=p,f1=emvAt(i,varJ,a2)-emvAt(j,varJ,a2);
              for(var it=0;it<40;it++){var m=(a2+b2)/2,fm=emvAt(i,varJ,m)-emvAt(j,varJ,m);if(Math.sign(fm)===Math.sign(f1))a2=m;else b2=m}
              var px=(a2+b2)/2;crosses.push({p:px,i:i,j:j,above:emvAt(0,varJ,px)});
            }
            prev=cur;
          }
        }
        crosses.forEach(function(c){ctx.beginPath();ctx.arc(X(c.p),Y(emvAt(c.i,varJ,c.p)),4.5,0,7);ctx.fillStyle=cssVar("--red");ctx.fill()});
        var box=$("#dec-cross");
        if(!crosses.length)box.innerHTML='<p>No crossovers: the EMV ranking is the same for every value of P('+esc(D.states[varJ])+') from 0 to 1.</p>';
        else box.innerHTML='<p><strong>Flip points for P('+esc(D.states[varJ])+'):</strong></p><ul style="margin:4px 0 0;padding-left:20px">'+
          crosses.sort(function(a,b){return a.p-b.p}).map(function(c){
            var winnerBelow=emvAt(c.i,varJ,Math.max(0,c.p-0.02))>emvAt(c.j,varJ,Math.max(0,c.p-0.02))?D.alts[c.i]:D.alts[c.j];
            var winnerAbove=emvAt(c.i,varJ,Math.min(1,c.p+0.02))>emvAt(c.j,varJ,Math.min(1,c.p+0.02))?D.alts[c.i]:D.alts[c.j];
            return '<li>At p ≈ <strong>'+fmt(c.p,2)+'</strong>, <strong>'+esc(winnerAbove)+'</strong> overtakes <strong>'+esc(winnerBelow)+'</strong>.</li>'}).join("")+'</ul>'+
          '<p>Current estimate: p = '+fmt(cp,2)+' (dashed line) — best EMV there is <strong>'+esc(C.list[argmaxEmv(C)].alt)+'</strong>.</p>';
        function argmaxEmv(C2){var bi=0;C2.list.forEach(function(o,i){if(o.emv>C2.list[bi].emv)bi=i});return bi}
        var lbl="EMV sensitivity chart. ";crosses.forEach(function(c){lbl+="At probability "+fmt(c.p,2)+", "+D.alts[c.i]+" and "+D.alts[c.j]+" tie. "});
        cv.setAttribute("aria-label",lbl);
      }
      $("#dec-var").addEventListener("change",function(){sync(false)});
      $("#dec-addalt").addEventListener("click",function(){D.alts.push("New alternative");D.pay.push(D.states.map(function(){return 50}));sync(true)});
      $("#dec-addstate").addEventListener("click",function(){if(D.states.length<5){D.states.push("New state");D.probs.push(0.2);D.pay.forEach(function(r){r.push(50)});sync(true)}});
      $("#dec-reset").addEventListener("click",function(){D=JSON.parse(JSON.stringify(DEC_DEFAULT));sync(true)});
      $("#dec-dl").addEventListener("click",function(){if(!lastCrit)return;var t="Decision Lab — analysis\nStates: "+D.states.join(", ")+"\nProbabilities (normalized): "+lastCrit.pr.map(function(p){return fmt(p,3)}).join(", ")+"\n\n";
        lastCrit.list.forEach(function(o){t+=o.alt+": EMV "+fmt(o.emv,1)+", worst "+fmt(o.min,1)+", best "+fmt(o.max,1)+", max regret "+fmt(o.regret,1)+"\n"});
        dl("decision-analysis.txt",t)});
      buildTable();sync(false);
      window.addEventListener("resize",function(){if(document.getElementById("dec-cv")&&lastCrit)drawSens(lastCrit)});
    }

    /* ================= LP 3D VISUALIZER ================= */
    function drawLP3D(cv,P,sol,view,sweepZ){
      var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
      var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),ink=cssVar("--ink"),acc=cssVar("--accent"),red=cssVar("--red"),amb=cssVar("--amber"),surf2=cssVar("--surface2");
      var XR=600,YR=700,i;
      P.cons.forEach(function(c){if(c.a>0)XR=Math.max(XR,c.rhs/c.a);if(c.b>0)YR=Math.max(YR,c.rhs/c.b)});
      sol.vertices.forEach(function(v){XR=Math.max(XR,v.x);YR=Math.max(YR,v.y)});
      XR=Math.min(XR*1.1,1e6);YR=Math.min(YR*1.1,1e6);
      var M=Math.max(XR,YR);
      var zmax=3260;sol.vertices.forEach(function(v){zmax=Math.max(zmax,v.z)});
      var zS=0.66*M/(zmax*1.1);
      var ca=Math.cos(view.az),sa=Math.sin(view.az),ce=Math.cos(view.el),se=Math.sin(view.el);
      var S=view.zoom*Math.min(W,H)/(1.62*M);
      function pr(x,y,z){var X=x-XR/2,Y=y-YR/2,Z=z*zS;var x1=X*ca-Y*sa,y1=X*sa+Y*ca;var z2=Z*ce-y1*se;return{x:W/2+x1*S,y:H*0.60-z2*S}}
      function line(a,b,style,w,dash){ctx.strokeStyle=style;ctx.lineWidth=w||1;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}
      function dot(p,r,fill,stroke){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.6;ctx.stroke()}}
      ctx.clearRect(0,0,W,H);
      var f00=pr(0,0,0),f10=pr(XR,0,0),f11=pr(XR,YR,0),f01=pr(0,YR,0);
      ctx.beginPath();ctx.moveTo(f00.x,f00.y);ctx.lineTo(f10.x,f10.y);ctx.lineTo(f11.x,f11.y);ctx.lineTo(f01.x,f01.y);ctx.closePath();
      ctx.fillStyle=surf2;ctx.globalAlpha=.55;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=grid;ctx.lineWidth=1;ctx.stroke();
      function niceStep(m){var p=Math.pow(10,Math.floor(Math.log10(m)));var s=m/p;return (s<=1?1:s<=2?2:s<=2.5?2.5:s<=5?5:10)*p}
      var gx=niceStep(XR/4),gy=niceStep(YR/4),v;
      for(v=gx;v<XR;v+=gx)line(pr(v,0,0),pr(v,YR,0),grid,1);
      for(v=gy;v<YR;v+=gy)line(pr(0,v,0),pr(XR,v,0),grid,1);
      line(pr(0,0,0),pr(XR,0,0),axis,1.6);line(pr(0,0,0),pr(0,YR,0),axis,1.6);line(pr(0,0,0),pr(0,0,zmax*1.1),axis,1.6);
      ctx.fillStyle=axis;ctx.font="bold 12px system-ui";ctx.textAlign="left";
      var lx=pr(XR,0,0);ctx.fillText("Xv",lx.x+5,lx.y+4);
      var ly=pr(0,YR,0);ctx.fillText("Xp",ly.x-6,ly.y-7);
      var lz=pr(0,0,zmax*1.1);ctx.fillText("Profit",lz.x-16,lz.y-8);
      var poly=feasiblePolygon(P,XR,YR);
      if(poly.length>2){ctx.beginPath();poly.forEach(function(p,i2){var q=pr(p.x,p.y,0);if(i2===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=acc;ctx.globalAlpha=.20;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=acc;ctx.lineWidth=1.6;ctx.stroke()}
      function lineSeg(c){var pts=[];function add(x,y){if(x>=-1e-9&&x<=XR+1e-9&&y>=-1e-9&&y<=YR+1e-9){for(var k=0;k<pts.length;k++)if(Math.hypot(pts[k].x-x,pts[k].y-y)<1e-6)return;pts.push({x:Math.max(0,Math.min(XR,x)),y:Math.max(0,Math.min(YR,y))})}}
        if(Math.abs(c.b)>1e-12){add(0,c.rhs/c.b);add(XR,(c.rhs-c.a*XR)/c.b)}
        if(Math.abs(c.a)>1e-12){add(c.rhs/c.a,0);add((c.rhs-c.b*YR)/c.a,YR)}
        return pts.length>=2?[pts[0],pts[1]]:null}
      P.cons.forEach(function(c,i2){var sg=lineSeg(c);if(!sg)return;line(pr(sg[0].x,sg[0].y,0),pr(sg[1].x,sg[1].y,0),CONCOLS[i2%6],1.8);
        var mx=(sg[0].x+sg[1].x)/2,my=(sg[0].y+sg[1].y)/2,lp=pr(mx,my,0);ctx.fillStyle=CONCOLS[i2%6];ctx.font="bold 11px system-ui";ctx.fillText("C"+(i2+1),lp.x+4,lp.y-4)});
      /* full objective (profit) plane, faint */
      var pc=[pr(0,0,0),pr(XR,0,P.cx*XR),pr(XR,YR,P.cx*XR+P.cy*YR),pr(0,YR,P.cy*YR)];
      ctx.beginPath();ctx.moveTo(pc[0].x,pc[0].y);for(i=1;i<4;i++)ctx.lineTo(pc[i].x,pc[i].y);ctx.closePath();
      ctx.fillStyle=acc;ctx.globalAlpha=.06;ctx.fill();ctx.globalAlpha=1;
      /* profit surface over the feasible region */
      if(poly.length>2){
        var cen={x:0,y:0};poly.forEach(function(p){cen.x+=p.x/poly.length;cen.y+=p.y/poly.length});
        var cTop=pr(cen.x,cen.y,objAt(P,cen.x,cen.y));
        for(i=0;i<poly.length;i++){var q1=pr(poly[i].x,poly[i].y,objAt(P,poly[i].x,poly[i].y));var pn=poly[(i+1)%poly.length],q2=pr(pn.x,pn.y,objAt(P,pn.x,pn.y));
          ctx.beginPath();ctx.moveTo(cTop.x,cTop.y);ctx.lineTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.closePath();ctx.fillStyle=acc;ctx.globalAlpha=.30;ctx.fill();ctx.globalAlpha=1}
        for(i=0;i<poly.length;i++){var pA=poly[i],pB=poly[(i+1)%poly.length],mx2=(pA.x+pB.x)/2,my2=(pA.y+pB.y)/2,ci2=-1;
          P.cons.forEach(function(c,k){if(Math.abs(c.a*mx2+c.b*my2-c.rhs)<1e-4)ci2=k});
          line(pr(pA.x,pA.y,objAt(P,pA.x,pA.y)),pr(pB.x,pB.y,objAt(P,pB.x,pB.y)),ci2>=0?CONCOLS[ci2%6]:acc,2)}
      }
      /* extreme points: floor dot, vertical line, surface dot */
      sol.vertices.forEach(function(v2){var isOpt=sol.opt&&Math.hypot(v2.x-sol.opt.x,v2.y-sol.opt.y)<1e-6;
        line(pr(v2.x,v2.y,0),pr(v2.x,v2.y,v2.z),isOpt?red:axis,isOpt?1.8:1.1,isOpt?[]:[4,3]);
        dot(pr(v2.x,v2.y,0),2.6,ink);dot(pr(v2.x,v2.y,v2.z),isOpt?5.5:3,isOpt?red:ink)});
      if(sol.opt){var o1=pr(sol.opt.x,sol.opt.y,sol.opt.z);ctx.fillStyle=red;ctx.font="bold 12px system-ui";ctx.fillText("optimum ("+trimNum(sol.opt.x)+", "+trimNum(sol.opt.y)+")",o1.x+9,o1.y-6)}
      /* ---- sweep: horizontal profit-level plane + isoprofit line ---- */
      if(sweepZ>0.5){
        var sp=[pr(0,0,sweepZ),pr(XR,0,sweepZ),pr(XR,YR,sweepZ),pr(0,YR,sweepZ)];
        ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);for(i=1;i<4;i++)ctx.lineTo(sp[i].x,sp[i].y);ctx.closePath();
        ctx.fillStyle=amb;ctx.globalAlpha=.13;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=amb;ctx.lineWidth=1.4;ctx.stroke();
        /* isoprofit segment: cx*x + cy*y = sweepZ inside the floor box */
        var iso=[];
        function addIso(x,y){if(x>=-1e-6&&x<=XR+1e-6&&y>=-1e-6&&y<=YR+1e-6){for(var k=0;k<iso.length;k++)if(Math.hypot(iso[k].x-x,iso[k].y-y)<1e-4)return;iso.push({x:Math.max(0,Math.min(XR,x)),y:Math.max(0,Math.min(YR,y))})}}
        if(Math.abs(P.cy)>1e-12){addIso(0,sweepZ/P.cy);addIso(XR,(sweepZ-P.cx*XR)/P.cy)}
        if(Math.abs(P.cx)>1e-12){addIso(sweepZ/P.cx,0);addIso((sweepZ-P.cy*YR)/P.cx,YR)}
        if(iso.length>=2){
          line(pr(iso[0].x,iso[0].y,0),pr(iso[1].x,iso[1].y,0),amb,3.2);
          line(pr(iso[0].x,iso[0].y,sweepZ),pr(iso[1].x,iso[1].y,sweepZ),amb,2);
          line(pr(iso[0].x,iso[0].y,0),pr(iso[0].x,iso[0].y,sweepZ),amb,1,[3,3]);
          line(pr(iso[1].x,iso[1].y,0),pr(iso[1].x,iso[1].y,sweepZ),amb,1,[3,3]);
        }
      }
    }

    /* ================= DECISION TREE BUILDER ================= */
    var TREE_UID=1;
    function tNode(kind,name,payoff){
      return{id:"n"+(TREE_UID++),kind:kind,name:name,payoff:(payoff===undefined?0:payoff),branches:[]};

    function tBranch(label,prob,child){return{label:label,prob:prob,child:child}}

        tBranch("Weak demand",0.2,tNode("terminal","Weak sales",-20))

    function treeClone(o){return JSON.parse(JSON.stringify(o))}
    function treeFind(node,id){
      if(node.id===id)return node;
      for(var i=0;i<node.branches.length;i++){var r=treeFind(node.branches[i].child,id);if(r)return r}
      return null;
    }
    function treeParentOf(node,id,parent,branch){
      if(node.id===id)return{parent:parent,branch:branch||null};
      for(var i=0;i<node.branches.length;i++){var r=treeParentOf(node.branches[i].child,id,node,node.branches[i]);if(r)return r}
      return null;
    }
    function treeNewIds(node){

    /* rollback: returns {ev, bestIdx (for decisions), errors:[...]} and annotates node._ev */
    function treeRollback(node,errors){
      if(node.kind==="terminal"){node._ev=+node.payoff||0;return node._ev}
      if(!node.branches.length){node._ev=0;errors.push("“"+node.name+"” has no branches yet.");return 0}
      if(node.kind==="chance"){
        var s=0;node.branches.forEach(function(b){s+=+b.prob||0});

        node._ev=ev;return ev;
      }
      /* decision */
      var best=-Infinity,bi=0;
      node.branches.forEach(function(b,i){var v=treeRollback(b.child,errors);b._ev=v;if(v>best){best=v;bi=i}});
      node._best=bi;node._ev=best;return best;
    }

      if(node.kind==="chance"){node.branches.forEach(function(b){treeDist(b.child,prob*(+b.prob||0),out)});return}
      if(node.branches.length){var bi=(node._best!==undefined?node._best:0);treeDist(node.branches[bi].child,prob,out)}
    }

    /* ================= QUEUING LAB ================= */
    function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r}
    function queueCompute(S){
      var lam=S.lam,model=S.model,out={ok:false};
      if(!(lam>0))return{ok:false,msg:"Arrival rate λ must be positive."};
      if(model==="mg1"){
        var mean=S.meanSvc,sd=S.sdSvc;
        if(!(mean>0))return{ok:false,msg:"Average service time must be positive."};
        if(sd<0)return{ok:false,msg:"Service-time standard deviation cannot be negative."};
        var mu1=1/mean,rho1=lam*mean;
        out.mu=mu1;out.rho=rho1;out.s=1;
        if(rho1>=1)return{ok:false,unstable:true,rho:rho1,msg:"Unstable: ρ = λ · E[S] = "+fmt(rho1,3)+" ≥ 1. Arrivals outpace service, so the queue grows without bound and no steady state exists."};
        var Lq=(lam*lam*sd*sd+rho1*rho1)/(2*(1-rho1));
        var Wq=Lq/lam,W=Wq+mean,L=lam*W;
        out.ok=true;out.L=L;out.Lq=Lq;out.W=W;out.Wq=Wq;out.P0=1-rho1;out.Pw=rho1;
        out.dist=null;
        out.notes="Pollaczek–Khinchine: Lq = (λ²σ² + ρ²) / (2(1 − ρ)). With σ = 0 this is a deterministic-service queue; as σ grows, the same average service time produces a longer wait — variability itself creates queues.";
        return out;
      }
      var mu=S.mu,s=(model==="mm1")?1:Math.max(1,Math.round(S.s));
      if(!(mu>0))return{ok:false,msg:"Service rate μ must be positive."};
      var a=lam/mu,rho=a/s;
      out.mu=mu;out.s=s;out.rho=rho;out.a=a;
      if(model==="mmsk"){
        var K=Math.max(s,Math.round(S.K));
        out.K=K;
        var w=[],sum=0,i,n;
        for(n=0;n<=K;n++){var wn=n<=s?Math.pow(a,n)/fact(n):Math.pow(a,s)/fact(s)*Math.pow(a/s,n-s);w.push(wn);sum+=wn}

        var lamEff=lam*(1-ps[K]);
        out.ok=true;out.P0=P0;out.L=L;out.Lq=Lq;out.W=L/lamEff;out.Wq=Lq/lamEff;out.lamEff=lamEff;
        var pBusy=0;for(n=s;n<=K;n++)pBusy+=ps[n];

        out.notes="Finite capacity K = "+K+" in the system at most. Arrivals that find K already present are turned away (probability "+fmt(ps[K],4)+"), so the effective arrival rate is λ(1 − P_K) = "+fmt(lamEff,3)+", and Little's law uses that effective rate. This system is always stable — the queue cannot grow past K.";
        return out;
      }
      if(rho>=1)return{ok:false,unstable:true,rho:rho,msg:"Unstable: λ = "+trimNum(lam)+" ≥ s·μ = "+trimNum(s*mu)+". Arrivals outpace total service capacity, so the queue grows without bound and no steady state exists. Add servers or raise μ."};
      var sum2=0,i2;
      for(i2=0;i2<s;i2++)sum2+=Math.pow(a,i2)/fact(i2);
      var lastTerm=Math.pow(a,s)/(fact(s)*(1-rho));

      var ps2=[],cum=0,nn=0;

      return out;

    /* ================= shared statistics helpers ================= */
    function erfNR(x){ /* Numerical Recipes erfc-based erf, ~1e-7 accuracy */
      var t,z,ans; z=Math.abs(x); t=1/(1+0.5*z);
      ans=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277)))))))));
      return x>=0?1-ans:ans-1;
    }
    function normCdf(z){return 0.5*(1+erfNR(z/Math.SQRT2))}
    function normPdf(x,mu,sd){var z=(x-mu)/sd;return Math.exp(-0.5*z*z)/(sd*Math.sqrt(2*Math.PI))}
    function normInv(p){ /* Acklam's inverse normal CDF */
      if(p<=0)return -Infinity; if(p>=1)return Infinity;
      var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
      var b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
      var c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
      var d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
      var plow=0.02425,phigh=1-plow,q,r;
      if(p<plow){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
      if(p<=phigh){q=p-0.5;r=q*q;return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
      q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
    function logGamma(x){var c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.001208650973866179,-0.5395239384953e-5];var y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);var ser=1.000000000190015;for(var j=0;j<6;j++)ser+=c[j]/++y;return -tmp+Math.log(2.5066282746310005*ser/x)}
    function binomPMF(n,p,k){if(k<0||k>n)return 0;if(p===0)return k===0?1:0;if(p===1)return k===n?1:0;
      return Math.exp(logGamma(n+1)-logGamma(k+1)-logGamma(n-k+1)+k*Math.log(p)+(n-k)*Math.log(1-p))}
    function binomCDF(n,p,k){var s=0;for(var i=0;i<=Math.floor(k);i++)s+=binomPMF(n,p,i);return Math.min(1,s)}
    function poisPMF(lam,k){if(k<0)return 0;return Math.exp(-lam+k*Math.log(lam)-logGamma(k+1))}
    function poisCDF(lam,k){var s=0;for(var i=0;i<=Math.floor(k);i++)s+=poisPMF(lam,i);return Math.min(1,s)}
    function expCDF(lam,x){return x<=0?0:1-Math.exp(-lam*x)}
    function quantile7(sorted,p){var n=sorted.length;if(!n)return NaN;if(n===1)return sorted[0];
      var pos=(n-1)*p,lo=Math.floor(pos),hi=Math.min(n-1,lo+1);return sorted[lo]+(sorted[hi]-sorted[lo])*(pos-lo)}
    function meanOf(a){return a.reduce(function(s,v){return s+v},0)/a.length}
    function medianOf(a){var s=a.slice().sort(function(x,y){return x-y});return quantile7(s,0.5)}
    function sdOf(a,pop){var m=meanOf(a),s=0;a.forEach(function(v){s+=(v-m)*(v-m)});return Math.sqrt(s/(pop?a.length:Math.max(1,a.length-1)))}
    function ols(xs,ys){var n=xs.length,mx=meanOf(xs),my=meanOf(ys),sxy=0,sxx=0,syy=0,i;
      for(i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)*(xs[i]-mx);syy+=(ys[i]-my)*(ys[i]-my)}
      var slope=sxx>0?sxy/sxx:0,icpt=my-slope*mx,r=(sxx>0&&syy>0)?sxy/Math.sqrt(sxx*syy):0;

    function parseNums(txt){return String(txt||"").split(/[\s,;]+/).map(function(v){return parseFloat(v)}).filter(function(v){return isFinite(v)})}
    function parsePairs(txt){var pts=[];String(txt||"").split(/\n+/).forEach(function(line){var v=line.split(/[\s,;]+/).map(parseFloat).filter(function(x){return isFinite(x)});if(v.length>=2)pts.push({x:v[0],y:v[1]})});return pts}

    /* ================= contour engine (marching squares) ================= */
    function contourSegs(f,x0,x1,y0,y1,nx,ny,level){
      var dx=(x1-x0)/nx,dy=(y1-y0)/ny,vals=[],i,j;
      for(j=0;j<=ny;j++){vals.push([]);for(i=0;i<=nx;i++)vals[j].push(f(x0+i*dx,y0+j*dy)-level)}
      function interp(ax,ay,av,bx,by,bv){var t=av/(av-bv);return[ax+t*(bx-ax),ay+t*(by-ay)]}
      var segs=[];
      for(j=0;j<ny;j++)for(i=0;i<nx;i++){
        var xA=x0+i*dx,xB=x0+(i+1)*dx,yA=y0+j*dy,yB=y0+(j+1)*dy;
        var vBL=vals[j][i],vBR=vals[j][i+1],vTR=vals[j+1][i+1],vTL=vals[j+1][i];
        var idx=(vBL>0?1:0)|(vBR>0?2:0)|(vTR>0?4:0)|(vTL>0?8:0);
        if(idx===0||idx===15)continue;
        var bot=function(){return interp(xA,yA,vBL,xB,yA,vBR)};
        var rgt=function(){return interp(xB,yA,vBR,xB,yB,vTR)};
        var top=function(){return interp(xA,yB,vTL,xB,yB,vTR)};
        var lft=function(){return interp(xA,yA,vBL,xA,yB,vTL)};
        function seg(p,q){segs.push([p[0],p[1],q[0],q[1]])}
        switch(idx){
          case 1: case 14: seg(lft(),bot()); break;
          case 2: case 13: seg(bot(),rgt()); break;
          case 3: case 12: seg(lft(),rgt()); break;
          case 4: case 11: seg(rgt(),top()); break;
          case 6: case 9: seg(bot(),top()); break;
          case 7: case 8: seg(lft(),top()); break;
          case 5: seg(lft(),top()); seg(bot(),rgt()); break;
          case 10: seg(lft(),bot()); seg(rgt(),top()); break;
        }
      }
      return segs;
    }
    /* draws contour lines for f over [x0,x1]x[y0,y1]; cfg: {levels, hiLevel, point, arrow:{x,y,dx,dy}, poly, optMark, trail} */
    function drawContourPlot(cv,f,cfg){
      var fz=fitCanvas(cv),ctx=fz.ctx,W=fz.W,H=fz.H;
      var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),ink=cssVar("--ink"),acc=cssVar("--accent"),amb=cssVar("--amber"),red=cssVar("--red");
      var padL=46,padR=14,padT=12,padB=34,pw=W-padL-padR,ph=H-padT-padB;
      var us=Math.min(pw/(cfg.x1-cfg.x0),ph/(cfg.y1-cfg.y0));
      var ox=padL+(pw-us*(cfg.x1-cfg.x0))/2, oy=padT+(ph-us*(cfg.y1-cfg.y0))/2;
      function X(x){return ox+(x-cfg.x0)*us} function Y(y){return oy+ph-(y-cfg.y0)*us-us*(0)} /* oy already top */
      Y=function(y){return oy+(cfg.y1-y)*us};
      function invX(px){return cfg.x0+(px-ox)/us} function invY(py){return cfg.y1-(py-oy)/us}
      ctx.clearRect(0,0,W,H);
      ctx.font="11px ui-monospace,monospace";ctx.fillStyle=axis;ctx.strokeStyle=grid;ctx.lineWidth=1;
      var stepX=(cfg.x1-cfg.x0)/6,stepY=(cfg.y1-cfg.y0)/6,i;
      ctx.textAlign="center";
      for(i=0;i<=6;i++){var gx=cfg.x0+stepX*i;ctx.beginPath();ctx.moveTo(X(gx),oy);ctx.lineTo(X(gx),oy+us*(cfg.y1-cfg.y0));ctx.stroke();ctx.fillText(fmt(gx,Math.abs(gx%1)>1e-9?1:0),X(gx),H-18)}

      for(i=0;i<=6;i++){var gy=cfg.y0+stepY*i;ctx.beginPath();ctx.moveTo(ox,Y(gy));ctx.lineTo(ox+us*(cfg.x1-cfg.x0),Y(gy));ctx.stroke();ctx.fillText(fmt(gy,Math.abs(gy%1)>1e-9?1:0),ox-6,Y(gy)+4)}
      ctx.fillText("x →",W-16,H-18);ctx.textAlign="left";ctx.fillText("y",6,oy+4);
      if(cfg.poly&&cfg.poly.length>2){ctx.beginPath();cfg.poly.forEach(function(p,k){if(k===0)ctx.moveTo(X(p[0]),Y(p[1]));else ctx.lineTo(X(p[0]),Y(p[1]))});ctx.closePath();ctx.fillStyle=acc;ctx.globalAlpha=.15;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=acc;ctx.lineWidth=1.6;ctx.stroke()}

        ctx.strokeStyle=hi?amb:acc;ctx.globalAlpha=hi?1:0.55;ctx.lineWidth=hi?2.4:1.1;
        ctx.beginPath();segs.forEach(function(s){ctx.moveTo(X(s[0]),Y(s[1]));ctx.lineTo(X(s[2]),Y(s[3]))});ctx.stroke();ctx.globalAlpha=1;
        if(segs.length){var s0=segs[Math.floor(segs.length/2)];ctx.fillStyle=hi?amb:axis;ctx.font="bold 10.5px ui-monospace,monospace";ctx.textAlign="left";ctx.fillText(fmt(L,Math.abs(L%1)>1e-9?1:0),X(s0[0])+3,Y(s0[1])-3);ctx.font="11px ui-monospace,monospace"}
      });
      if(cfg.trail&&cfg.trail.length>1){ctx.strokeStyle=red;ctx.lineWidth=1.6;ctx.setLineDash([4,3]);ctx.beginPath();cfg.trail.forEach(function(p,k){if(k===0)ctx.moveTo(X(p[0]),Y(p[1]));else ctx.lineTo(X(p[0]),Y(p[1]))});ctx.stroke();ctx.setLineDash([]);
        cfg.trail.forEach(function(p){ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),2.6,0,7);ctx.fillStyle=red;ctx.fill()})}
      if(cfg.optMark){ctx.beginPath();ctx.arc(X(cfg.optMark[0]),Y(cfg.optMark[1]),7,0,7);ctx.strokeStyle=red;ctx.lineWidth=2.2;ctx.stroke();ctx.beginPath();ctx.arc(X(cfg.optMark[0]),Y(cfg.optMark[1]),3.6,0,7);ctx.fillStyle=red;ctx.fill();
        ctx.fillStyle=red;ctx.font="bold 11.5px system-ui";ctx.textAlign="left";ctx.fillText(cfg.optMark[2]||"optimum",X(cfg.optMark[0])+9,Y(cfg.optMark[1])-7);ctx.font="11px ui-monospace,monospace"}
      if(cfg.arrow){var a=cfg.arrow,mag=Math.hypot(a.dx,a.dy);
        if(mag>1e-12){var L2=Math.min(1.6,Math.max(0.5,mag))*us*0.9,uxv=a.dx/mag,uyv=a.dy/mag;
          var ex=X(a.x)+uxv*L2,ey=Y(a.y)-uyv*L2;
          ctx.strokeStyle=amb;ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(X(a.x),Y(a.y));ctx.lineTo(ex,ey);ctx.stroke();

          ctx.fillStyle=amb;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-9*Math.cos(ang-0.42),ey-9*Math.sin(ang-0.42));ctx.lineTo(ex-9*Math.cos(ang+0.42),ey-9*Math.sin(ang+0.42));ctx.closePath();ctx.fill()}}
      if(cfg.point){ctx.beginPath();ctx.arc(X(cfg.point[0]),Y(cfg.point[1]),5.5,0,7);ctx.fillStyle=ink;ctx.fill();ctx.beginPath();ctx.arc(X(cfg.point[0]),Y(cfg.point[1]),2.2,0,7);ctx.fillStyle=cssVar("--surface");ctx.fill()}
      cv._map={invX:invX,invY:invY,x0:cfg.x0,x1:cfg.x1,y0:cfg.y0,y1:cfg.y1};
      return{X:X,Y:Y};
    }

    /* ================= PAIRWISE (AHP) ================= */
    var AHP_RI=[0,0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.48,1.56,1.57,1.59];
    var SAATY=[9,8,7,6,5,4,3,2,1,1/2,1/3,1/4,1/5,1/6,1/7,1/8,1/9];
    var SAATY_WORD={9:"extreme",7:"very strong",5:"strong",3:"moderate",2:"weak",1:"equal"};
    function saatyLabel(v){
      if(v===1)return "1 · equal";
      if(v>1)return v+" · "+(SAATY_WORD[v]||"")+" more important";
      return "1/"+Math.round(1/v)+" · "+(SAATY_WORD[Math.round(1/v)]||"")+" less important";
    }
    function ahpPrior(A){
      var n=A.length,v=[],i,j,it;
      for(i=0;i<n;i++)v.push(1/n);
      for(it=0;it<300;it++){var w=[],sum=0;
        for(i=0;i<n;i++){var s=0;for(j=0;j<n;j++)s+=A[i][j]*v[j];w.push(s);sum+=s}
        var diff=0;for(i=0;i<n;i++){w[i]/=sum;diff=Math.max(diff,Math.abs(w[i]-v[i]))}
        v=w;if(diff<1e-13)break}
      var lam=0;for(i=0;i<n;i++){var s2=0;for(j=0;j<n;j++)s2+=A[i][j]*v[j];lam+=s2/v[i]}lam/=n;
      var ci=n>1?(lam-n)/(n-1):0, cr=n>2?ci/AHP_RI[n]:0;
      return{w:v,lam:lam,ci:ci,cr:cr};
    }
    function ahpMatrix(items,J,key){
      var n=items.length,A=[],i,j;
      for(i=0;i<n;i++){A.push([]);for(j=0;j<n;j++){
        if(i===j)A[i].push(1);
        else if(i<j)A[i].push(+(J[key]&&J[key][items[i].id+">"+items[j].id])||1);
        else A[i].push(1/(+(J[key]&&J[key][items[j].id+">"+items[i].id])||1));
      }}
      return A;
    }
    var AHP_UID=100;
    function ahpDefault(){
      AHP_UID=100;
      function nid(p){return p+(++AHP_UID)}
      var cost={id:nid("c"),name:"Cost",subs:[{id:nid("s"),name:"Purchase price"},{id:nid("s"),name:"Running costs"}]};
      var comf={id:nid("c"),name:"Comfort",subs:[]};
      var perf={id:nid("c"),name:"Performance",subs:[]};
      var alts=[{id:nid("a"),name:"Sedan"},{id:nid("a"),name:"Hatchback"},{id:nid("a"),name:"SUV"}];
      var J={};
      function setJ(key,items,pairs){var o={};pairs.forEach(function(pr){o[items[pr[0]].id+">"+items[pr[1]].id]=pr[2]});J[key]=o}
      var crits=[cost,comf,perf];
      setJ("crit",crits,[[0,1,3],[0,2,5],[1,2,2]]);
      setJ("sub:"+cost.id,cost.subs,[[0,1,2]]);
      setJ("alt:c"+cost.id+"s"+cost.subs[0].id,alts,[[0,1,2],[0,2,4],[1,2,2]]);
      setJ("alt:c"+cost.id+"s"+cost.subs[1].id,alts,[[0,1,1],[0,2,3],[1,2,3]]);
      setJ("alt:c"+comf.id,alts,[[0,1,1/3],[0,2,1/4],[1,2,1/2]]);
      setJ("alt:c"+perf.id,alts,[[0,1,1/2],[0,2,2],[1,2,3]]);
      return{goal:"Choose the best car for a new driver",crits:crits,alts:alts,J:J};
    }
    function ahpSets(P){
      var sets=[];
      if(P.crits.length>=2)sets.push({key:"crit",title:"Criteria — how much each matters for the goal",items:P.crits,kind:"crit"});
      P.crits.forEach(function(c){
        if(c.subs.length>=2)sets.push({key:"sub:"+c.id,title:"Sub-criteria of "+c.name,items:c.subs,kind:"sub"});
      });
      P.crits.forEach(function(c){
        if(c.subs.length){c.subs.forEach(function(s){sets.push({key:"alt:c"+c.id+"s"+s.id,title:"Alternatives under "+c.name+" → "+s.name,items:P.alts,kind:"alt"})})}
        else sets.push({key:"alt:c"+c.id,title:"Alternatives under "+c.name,items:P.alts,kind:"alt"});
      });
      return sets.filter(function(s){return s.items.length>=2});
    }
    function ahpSolve(P,critMult){ /* critMult: {critId: multiplier} optional sensitivity override */
      var sets=ahpSets(P),priors={};
      sets.forEach(function(s){priors[s.key]=ahpPrior(ahpMatrix(s.items,P.J,s.key))});
      var critW={};
      if(P.crits.length===1)critW[P.crits[0].id]=1;
      else if(priors["crit"])P.crits.forEach(function(c,i){critW[c.id]=priors["crit"].w[i]});
      if(critMult){
        var tot=0;P.crits.forEach(function(c){critW[c.id]=critW[c.id]*(critMult[c.id]||1);tot+=critW[c.id]});
        if(tot>0)P.crits.forEach(function(c){critW[c.id]/=tot});
      }
      var terminal=[]; /* {label, globalW, setKey} */
      P.crits.forEach(function(c){
        if(c.subs.length>=2){var sp=priors["sub:"+c.id];
          c.subs.forEach(function(s,j){terminal.push({label:c.name+" → "+s.name,gw:critW[c.id]*(sp?sp.w[j]:1/c.subs.length),setKey:"alt:c"+c.id+"s"+s.id})});
        }else if(c.subs.length===1){terminal.push({label:c.name+" → "+c.subs[0].name,gw:critW[c.id],setKey:"alt:c"+c.id+"s"+c.subs[0].id});
        }else terminal.push({label:c.name,gw:critW[c.id],setKey:"alt:c"+c.id});
      });
      var scores=P.alts.map(function(a){return{name:a.name,score:0,parts:[]}});
      terminal.forEach(function(t){
        var pr=priors[t.setKey];if(!pr)return;
        P.alts.forEach(function(a,i){scores[i].score+=t.gw*pr.w[i];scores[i].parts.push({t:t.label,w:t.gw,p:pr.w[i]})});
      });
      return{priors:priors,critW:critW,terminal:terminal,scores:scores,sets:sets};
    }
    function renderPairwise(app,state){

      function nid(p){return p+(++AHP_UID)}
      var h=toolHead("Decision Analysis","PairWise — AHP Decision Tool",

        '<div class="btnrow"><button type="button" class="btn small" id="ah-dl">Download decision summary (.txt)</button></div></section>';

      h+='<section class="panel"><h2>Stage 2 · Make judgments</h2><p class="hint">Each cell asks: how much more important is the <strong>row</strong> item than the <strong>column</strong> item? 1 = equal, 3 = moderate, 5 = strong, 7 = very strong, 9 = extreme; fractions reverse the direction. The mirror cell fills itself in.</p><div id="ah-judge"></div></section>';
      h+='<section class="panel"><h2>Sensitivity — push one criterion</h2>'+
        '<label class="fl" for="ah-sens-c">Criterion</label><select id="ah-sens-c"></select>'+
        '<label class="fl" for="ah-sens-v">Its weight, as % of the judged weight: <strong id="ah-sens-lab">100%</strong></label><input type="range" id="ah-sens-v" min="0" max="300" step="5" value="100">'+
        '<div id="ah-sens-out" class="readout" aria-live="polite"></div>'+
        '<p class="hint">The other criteria keep their relative shares and absorb the difference. If the winner survives a wide range of weights, the recommendation is robust; if it flips at 105%, it is a coin toss dressed as analysis.</p></section>';
      h+=teachBox("Step 3 · Check","Check yourself",
        "One of your matrices comes back with CR = 0.24. What is the right response?",
        ["Report the results anyway — CR is only a formality","Revisit the judgments in that matrix: find the comparisons that contradict the others and reconsider them","Add more alternatives until CR falls","Multiply all judgments by 0.76"],1,

      var lastSol=null;
      function rebuild(){renderPairwise(app,P);setHash("pairwise",P)}
      function critRow(c){
        var d=document.createElement("div");d.style.cssText="border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px";
        var inner='<div class="row2" style="grid-template-columns:1fr auto"><input type="text" class="ah-cname" value="'+esc(c.name)+'" aria-label="Criterion name"><button type="button" class="btn secondary small ah-cdel">✕</button></div>';
        inner+='<div class="ah-subs" style="margin-top:6px">'+c.subs.map(function(s){
          return '<div class="row2" style="grid-template-columns:1fr auto;margin-bottom:5px"><input type="text" class="ah-sname" data-sid="'+s.id+'" value="'+esc(s.name)+'" aria-label="Sub-criterion name"><button type="button" class="btn secondary small ah-sdel" data-sid="'+s.id+'">✕</button></div>'}).join("")+'</div>';

      }
      function buildEditors(){
        var cb=$("#ah-crits");cb.innerHTML="";P.crits.forEach(function(c){cb.appendChild(critRow(c))});
        var ab=$("#ah-alts");ab.innerHTML=P.alts.map(function(a){

        $$(".ah-adel",ab).forEach(function(b){b.addEventListener("click",function(){if(P.alts.length<=2)return;P.alts=P.alts.filter(function(x){return x.id!==b.dataset.aid});rebuild()})});

      function buildJudge(){

          hd+='<p class="hint" style="margin:0 0 6px">Priorities: '+set.items.map(function(it,i){return esc(it.name)+" <strong>"+fmt(pr.w[i],3)+"</strong>"}).join(" · ")+' · CR <strong>'+fmt(pr.cr,3)+'</strong>'+(pr.cr<0.1?' <span class="tag ok">consistent</span>':' <span class="tag bad">revise</span>')+'</p>';
          var tb='<div style="overflow-x:auto"><table class="data mtx"><thead><tr><th></th>'+set.items.map(function(it){return '<th>'+esc(it.name)+'</th>'}).join("")+'</tr></thead><tbody>';
          set.items.forEach(function(ri,i){

              else{var up=(P.J[set.key]&&P.J[set.key][cj.id+">"+ri.id])||1;tb+='<td class="num">'+(up===1?"1":(up>1?"1/"+up:Math.round(1/up)))+'</td>'}

      function refresh(){
        P.goal=$("#ah-goal").value;

        var S=ahpSolve(P);lastSol=S;
        /* consistency */
        var rows=S.sets.map(function(set){var pr=S.priors[set.key];
          return '<tr><td>'+esc(set.title)+'</td><td class="num">'+set.items.length+'</td><td class="num">'+fmt(pr.lam,3)+'</td><td class="num">'+fmt(pr.ci,3)+'</td><td class="num">'+fmt(pr.cr,3)+'</td><td>'+(pr.cr<0.1?'<span class="tag ok">OK</span>':'<span class="tag bad">Revise</span>')+'</td></tr>'}).join("");

          (worst<0.1?'<div class="banner good" style="margin-bottom:0">Every matrix is acceptably consistent (worst CR '+fmt(worst,3)+' &lt; 0.10). The priorities below are safe to interpret.</div>':'<div class="banner bad" style="margin-bottom:0">At least one matrix has CR ≥ 0.10 (worst '+fmt(worst,3)+'). Reconsider the judgments in the flagged matrix before trusting the ranking.</div>');

        var bars=ranked.map(function(s,i){

      function drawSens(){

    function nilSimulate(S){
      var rnd=mulberry32(S.seed>>>0);
      function expV(rate){return -Math.log(1-rnd())/rate}
      var lam=S.lam,mu=S.mu,s=S.s,dur=S.dur,warm=S.warm;
      var t=0,nextArr=expV(lam),arrCount=0;
      var servers=[],srvCust=[];for(var i0=0;i0<s;i0++){servers.push(0);srvCust.push(null)}
      var queue=[],cust=[],snaps=[];
      var area=0,areaQ=0,lastT=0,nSys=0,nQ=0;
      function advance(toT){if(toT>warm){var from=Math.max(lastT,warm);if(toT>from){area+=nSys*(toT-from);areaQ+=nQ*(toT-from)}}lastT=toT}
      function snap(type,desc){
        snaps.push({t:t,type:type,desc:desc,n:nSys,nq:nQ,
          srv:srvCust.map(function(c){return c?{id:c.id,start:c.start,end:c.end}:null}),
          q:queue.map(function(c){return c.id})});
      }
      snap("start","Doors open — the post office is empty.");
      var guard=0;
      while(guard++<400000){
        var nextDep=Infinity,depSrv=-1,i2;
        for(i2=0;i2<s;i2++)if(servers[i2]>0&&servers[i2]<nextDep){nextDep=servers[i2];depSrv=i2}
        if(nextArr===Infinity&&nextDep===Infinity)break;
        if(nextArr<=nextDep){
          t=nextArr;
          if(t>dur){nextArr=Infinity;continue}
          advance(t);arrCount++;
          var rec={id:arrCount,arr:t,start:null,end:null,srv:0};
          cust.push(rec);nSys++;
          var free=-1;for(var j=0;j<s;j++)if(servers[j]<=t){free=j;break}
          if(free>=0){rec.start=t;rec.srv=free+1;rec.end=t+expV(mu);servers[free]=rec.end;srvCust[free]=rec;
            snap("begin","C"+rec.id+" arrives and goes straight to station "+(free+1)+".")}
          else{queue.push(rec);nQ++;
            snap("arrive","C"+rec.id+" arrives and joins the line ("+nQ+" waiting).")}
          nextArr=t+expV(lam);
        }else{
          t=nextDep;advance(t);nSys--;
          var doneRec=srvCust[depSrv];
          if(queue.length){var nx=queue.shift();nQ--;nx.start=t;nx.srv=depSrv+1;nx.end=t+expV(mu);servers[depSrv]=nx.end;srvCust[depSrv]=nx;
            snap("depart","C"+(doneRec?doneRec.id:"?")+" leaves; C"+nx.id+" starts at station "+(depSrv+1)+".")}
          else{servers[depSrv]=0;srvCust[depSrv]=null;
            snap("depart","C"+(doneRec?doneRec.id:"?")+" leaves station "+(depSrv+1)+".")}
        }
        if(t>dur&&nextArr===Infinity&&queue.length===0){var allFree=true;for(var k=0;k<s;k++)if(servers[k]>t)allFree=false;if(allFree)break}
      }
      var obs=Math.max(1,dur-warm);
      var done=cust.filter(function(c){return c.end!==null&&c.arr>=warm});
      var allDone=cust.filter(function(c){return c.end!==null});
      function avg(a,f){return a.length?a.reduce(function(sm,c){return sm+f(c)},0)/a.length:NaN}
      return{snaps:snaps,cust:cust,
        L:area/obs,Lq:areaQ/obs,
        W:avg(done,function(c){return c.end-c.arr}),Wq:avg(done,function(c){return c.start-c.arr}),
        nMeasured:done.length,nArr:cust.length,nDone:allDone.length};
    }

        return P().f(nx,ny)>z0+1e-12;
      }

        for(var i=0;i<80;i++){var g=P().g(S.hx,S.hy);if(Math.hypot(g[0],g[1])<0.02)break;if(!stepOnce())break}

      $("#hk-preset").addEventListener("change",function(){S.preset=this.value;trail=[[S.hx,S.hy]];draw()});
      $("#hk-step").addEventListener("input",function(){S.step=+this.value;draw()});
      $("#hk-x").addEventListener("input",function(){S.hx=parseFloat(this.value)||0;trail=[[S.hx,S.hy]];draw()});
      $("#hk-y").addEventListener("input",function(){S.hy=parseFloat(this.value)||0;trail=[[S.hx,S.hy]];draw()});
      cv.addEventListener("pointerdown",function(e){

      draw();
      window.addEventListener("resize",function(){if(document.getElementById("hk-cv"))draw()});
    }

    /* ================= THAT'S WHAT LINEAR IS ALL ABOUT ================= */
    function renderLinear(app,state){

      if(state&&state.rhs){state.rhs.forEach(function(v,i){if(CS[i])CS[i].rhs=+v});
        if(state.on)state.on.forEach(function(v,i){if(CS[i])CS[i].on=!!v});
        if(state.shade)state.shade.forEach(function(v,i){if(CS[i])CS[i].shade=!!v});

        "Explain a feasible region as the intersection of half-planes, predict how it changes when a constraint is relaxed, tightened, or removed, and locate the corners where an optimum can live.",

        ["The region shrinks; the optimum stays","The region grows toward the upper right, but the optimum stops moving once Fabric (C3) becomes the only binding limit — extra labor beyond that adds nothing","The optimum grows without bound","Nothing: right-hand sides do not affect the region"],1,
        "Relaxing a constraint can only grow (or keep) the feasible region. But the optimum moves only until another constraint takes over as the binding one. Past that point more labor is worthless — its shadow price falls to zero. Watch the corner slide along the Fabric line as you drag.");
      h+='<div class="layout" style="margin-top:20px"><div class="stack">';
      h+='<section class="panel"><h2>Objective</h2>'+
        '<div class="row2"><div><label class="fl" for="ln-cx">Profit per OktoValve (x)</label><input type="number" id="ln-cx" step="any" value="'+base.cx+'"></div>'+
        '<div><label class="fl" for="ln-cy">Profit per OktoPrint (y)</label><input type="number" id="ln-cy" step="any" value="'+base.cy+'"></div></div>'+
        '<p class="hint">Maximize z = cx·x + cy·y, with x, y ≥ 0 always in force.</p></section>';
      h+='<section class="panel"><h2>Constraints — the pieces</h2><div id="ln-cons"></div>'+
        '<p class="hint"><strong>On</strong> includes the constraint in the region. <strong>Shade</strong> paints the forbidden side of its line — the half-plane it throws away. The feasible region is the part of the plane no constraint throws away.</p></section>';
      h+='<section class="panel"><h2>Corner points</h2><div id="ln-out" aria-live="polite"></div></section>';
      h+='</div><div class="stack">';
      h+='<section class="panel"><h2>The region, assembled</h2><canvas class="chart" id="ln-cv" data-ratio="0.8" role="img" aria-label="Feasible region built from constraint half-planes, with corner points and optimum"></canvas>'+
        '<p class="hint">Teal: the feasible polygon. Colored washes: forbidden half-planes of the shaded constraints. Dashed amber lines through the optimum: objective level lines.</p></section>';
      h+=teachBox("Step 3 · Check","Check yourself",
        "You switch C5 (minimum commitment, Xv + Xp ≥ 100) off. Which corner of the region disappears?",
        ["None — C5 touches nothing","The corner(s) on the line Xv + Xp = 100 near the origin: without C5 the region extends down to include the origin side","The optimal corner (440, 500)","Every corner with x = 0"],1,
        "C5 is a ≥ constraint: it cuts away the triangle near the origin where total production is under 100. Removing it restores that triangle, so the region gains the segment of the axes it had excluded. The far corner (440, 500) never touched C5, so it is unchanged.");
      h+='</div></div>';
      app.innerHTML=h;
      var box=$("#ln-cons");
      function eqText(c){return (c.a+" x + "+c.b+" y "+(c.op==="<="?"≤":"≥")+" "+trimNum(c.rhs)).replace(/\+ -/g,"− ")}
      CS.forEach(function(c,i){
        var d=document.createElement("div");d.className="sensctl";
        d.innerHTML='<div class="lab"><b><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:'+CONCOLS[i%6]+';margin-right:7px"></span>'+esc(c.name)+'</b>'+
          '<span><button type="button" class="btn secondary small ln-on" aria-pressed="'+c.on+'">On</button> <button type="button" class="btn secondary small ln-sh" aria-pressed="'+c.shade+'">Shade</button></span></div>'+
          '<div class="mono" style="font-size:13.5px;margin:2px 0 4px">'+esc(eqText(c))+'</div>'+
          '<div class="pair" style="display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center"><input type="range" class="ln-rhs" min="0" max="'+Math.max(100,Math.round(base.cons[i].rhs*2))+'" step="'+Math.max(1,Math.round(base.cons[i].rhs/50))+'" value="'+c.rhs+'" aria-label="Right-hand side of '+esc(c.name)+'"><input type="number" class="ln-rhsn" step="any" value="'+c.rhs+'" aria-label="Right-hand side value"></div>';
        $(".ln-on",d).addEventListener("click",function(){c.on=!c.on;this.setAttribute("aria-pressed",c.on);sync()});
        $(".ln-sh",d).addEventListener("click",function(){c.shade=!c.shade;this.setAttribute("aria-pressed",c.shade);sync()});
        $(".ln-rhs",d).addEventListener("input",function(){c.rhs=+this.value;$(".ln-rhsn",d).value=c.rhs;sync()});
        $(".ln-rhsn",d).addEventListener("input",function(){c.rhs=parseFloat(this.value)||0;$(".ln-rhs",d).value=c.rhs;sync()});
        box.appendChild(d);
      });
      function problem(){return{cx:base.cx,cy:base.cy,sense:"max",xname:"x",yname:"y",cons:CS.filter(function(c){return c.on}).map(function(c){return{a:c.a,b:c.b,op:c.op,rhs:c.rhs,name:c.name}})}}
      function sync(){
        base.cx=parseFloat($("#ln-cx").value)||0;base.cy=parseFloat($("#ln-cy").value)||0;
        setHash("linear",{rhs:CS.map(function(c){return c.rhs}),on:CS.map(function(c){return c.on}),shade:CS.map(function(c){return c.shade}),cx:base.cx,cy:base.cy});
        draw();
      }
      function clipPoly(poly,f){
        var out=[];for(var i=0;i<poly.length;i++){var cur=poly[i],prv=poly[(i+poly.length-1)%poly.length];var fc=f(cur),fp=f(prv);
          if(fc>=0&&fp<0){var t=fp/(fp-fc);out.push({x:prv.x+t*(cur.x-prv.x),y:prv.y+t*(cur.y-prv.y)});out.push(cur)}
          else if(fc>=0)out.push(cur);else if(fp>=0){var t2=fp/(fp-fc);out.push({x:prv.x+t2*(cur.x-prv.x),y:prv.y+t2*(cur.y-prv.y)})}}
        return out;
      }
      function draw(){
        var P=problem(),sol=solveLP(P),cv=$("#ln-cv");
        var f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;
        var grid=cssVar("--chart-grid"),axis=cssVar("--chart-axis"),ink=cssVar("--ink"),acc=cssVar("--accent"),amb=cssVar("--amber"),red=cssVar("--red");
        var xmax=10,ymax=10;
        CS.forEach(function(c){if(c.a>0)xmax=Math.max(xmax,c.rhs/c.a*1.15);if(c.b>0)ymax=Math.max(ymax,c.rhs/c.b*1.15)});
        sol.vertices.forEach(function(v){xmax=Math.max(xmax,v.x*1.2);ymax=Math.max(ymax,v.y*1.2)});
        xmax=Math.min(xmax,1e7);ymax=Math.min(ymax,1e7);
        var padL=54,padR=14,padT=12,padB=34,pw=W-padL-padR,ph=H-padT-padB;
        function X(x){return padL+pw*x/xmax} function Y(y){return padT+ph-ph*y/ymax}
        ctx.clearRect(0,0,W,H);
        ctx.font="11px ui-monospace,monospace";ctx.fillStyle=axis;ctx.strokeStyle=grid;ctx.lineWidth=1;
        function niceStep(m){var p=Math.pow(10,Math.floor(Math.log10(m)));var s=m/p;return(s<=1?1:s<=2?2:s<=2.5?2.5:s<=5?5:10)*p}
        var sx=niceStep(xmax/5),sy=niceStep(ymax/5),v;
        ctx.textAlign="center";for(v=0;v<=xmax;v+=sx){ctx.beginPath();ctx.moveTo(X(v),padT);ctx.lineTo(X(v),padT+ph);ctx.stroke();ctx.fillText(fmt(v,v<10&&v%1?1:0),X(v),H-18)}
        ctx.textAlign="right";for(v=0;v<=ymax;v+=sy){ctx.beginPath();ctx.moveTo(padL,Y(v));ctx.lineTo(padL+pw,Y(v));ctx.stroke();ctx.fillText(fmt(v,v<10&&v%1?1:0),padL-6,Y(v)+4)}
        ctx.fillText("x →",W-16,H-18);
        var boxPoly=[{x:0,y:0},{x:xmax,y:0},{x:xmax,y:ymax},{x:0,y:ymax}];
        /* forbidden half-planes */
        CS.forEach(function(c,i){
          if(!c.on||!c.shade)return;
          var forb=c.op==="<="?clipPoly(boxPoly,function(p){return c.a*p.x+c.b*p.y-c.rhs}):clipPoly(boxPoly,function(p){return c.rhs-(c.a*p.x+c.b*p.y)});
          if(forb.length>2){ctx.beginPath();forb.forEach(function(p,k){if(k===0)ctx.moveTo(X(p.x),Y(p.y));else ctx.lineTo(X(p.x),Y(p.y))});ctx.closePath();ctx.fillStyle=CONCOLS[i%6];ctx.globalAlpha=.13;ctx.fill();ctx.globalAlpha=1}
        });
        /* feasible polygon */
        var poly=feasiblePolygon(P,xmax,ymax);
        if(poly.length>2){ctx.beginPath();poly.forEach(function(p,k){if(k===0)ctx.moveTo(X(p.x),Y(p.y));else ctx.lineTo(X(p.x),Y(p.y))});ctx.closePath();ctx.fillStyle=acc;ctx.globalAlpha=.22;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=acc;ctx.lineWidth=1.8;ctx.stroke()}
        /* constraint lines */
        CS.forEach(function(c,i){
          ctx.strokeStyle=CONCOLS[i%6];ctx.lineWidth=c.on?1.7:1;ctx.globalAlpha=c.on?1:0.3;ctx.setLineDash(c.on?[]:[3,4]);
          var p1,p2;
          if(Math.abs(c.b)>1e-12){p1={x:0,y:c.rhs/c.b};p2={x:xmax,y:(c.rhs-c.a*xmax)/c.b}}
          else{p1={x:c.rhs/c.a,y:0};p2={x:c.rhs/c.a,y:ymax}}
          ctx.beginPath();ctx.moveTo(X(p1.x),Y(p1.y));ctx.lineTo(X(p2.x),Y(p2.y));ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
          ctx.fillStyle=CONCOLS[i%6];ctx.font="bold 11px system-ui";ctx.textAlign="left";
          var lx=Math.min(p2.x,xmax*0.97),ly=Math.abs(c.b)>1e-12?(c.rhs-c.a*lx)/c.b:ymax*0.9;
          if(ly>=0&&ly<=ymax)ctx.fillText("C"+(i+1),X(lx)+4,Y(ly)-4);ctx.font="11px ui-monospace,monospace";
        });
        /* objective level lines + corners + optimum */
        if(sol.status==="optimal"){
          ctx.strokeStyle=amb;ctx.lineWidth=1.2;ctx.setLineDash([3,4]);
          [0.5,0.75,1].forEach(function(fr){var z=sol.opt.z*fr;ctx.beginPath();
            if(Math.abs(P.cy)>1e-12){ctx.moveTo(X(0),Y(z/P.cy));ctx.lineTo(X(xmax),Y((z-P.cx*xmax)/P.cy))}
            else if(Math.abs(P.cx)>1e-12){ctx.moveTo(X(z/P.cx),Y(0));ctx.lineTo(X(z/P.cx),Y(ymax))}
            ctx.stroke()});ctx.setLineDash([]);
        }
        sol.vertices.forEach(function(vv){ctx.beginPath();ctx.arc(X(vv.x),Y(vv.y),4,0,7);ctx.fillStyle=ink;ctx.fill()});
        if(sol.opt){ctx.beginPath();ctx.arc(X(sol.opt.x),Y(sol.opt.y),8,0,7);ctx.strokeStyle=red;ctx.lineWidth=2.4;ctx.stroke();
          ctx.beginPath();ctx.arc(X(sol.opt.x),Y(sol.opt.y),4.5,0,7);ctx.fillStyle=red;ctx.fill();
          ctx.fillStyle=red;ctx.font="bold 12px system-ui";ctx.textAlign="left";ctx.fillText("optimum ("+fmt(sol.opt.x,sol.opt.x%1?1:0)+", "+fmt(sol.opt.y,sol.opt.y%1?1:0)+")",X(sol.opt.x)+11,Y(sol.opt.y)-8)}
        var out=$("#ln-out");
        if(sol.status==="infeasible")out.innerHTML='<div class="banner bad" style="margin:0"><strong>No feasible region.</strong> The half-planes that are switched on have no overlap — every point breaks at least one rule. Shade the half-planes to see which ones refuse to share ground.</div>';
        else if(sol.status==="unbounded")out.innerHTML='<div class="banner warn" style="margin:0"><strong>Unbounded.</strong> With these constraints on, the region runs off to infinity in a direction that improves the objective — there are corners, but no best one. Switch more constraints on.</div>';
        else{
          var rows=sol.vertices.slice().sort(function(a,b){return b.z-a.z}).map(function(vv){
            var isO=Math.hypot(vv.x-sol.opt.x,vv.y-sol.opt.y)<1e-6;
            return '<tr'+(isO?' class="hl"':"")+'><td class="num">('+fmt(vv.x,vv.x%1?2:0)+', '+fmt(vv.y,vv.y%1?2:0)+')</td><td class="num">'+fmt(vv.z)+'</td><td>'+(isO?"optimal":"")+'</td></tr>'}).join("");
          out.innerHTML='<p style="margin-top:0">With <strong>'+P.cons.length+' of '+CS.length+'</strong> constraints on, the region has <strong>'+sol.vertices.length+' corners</strong>. Best: <strong>z = '+fmt(sol.opt.z)+'</strong> at ('+fmt(sol.opt.x)+', '+fmt(sol.opt.y)+').</p><table class="data"><thead><tr><th>Corner (x, y)</th><th class="num">z</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
        }
        cv.setAttribute("aria-label","Feasible region with "+P.cons.length+" constraints active. Status: "+sol.status+(sol.opt?(", optimum z = "+fmt(sol.opt.z)+" at ("+fmt(sol.opt.x)+", "+fmt(sol.opt.y)+")"):"")+".");
      }
      ["ln-cx","ln-cy"].forEach(function(id){$("#"+id).addEventListener("input",sync)});
      sync();
      window.addEventListener("resize",function(){if(document.getElementById("ln-cv"))draw()});
    }

    var DIST_FAMS={
      normal:{label:"Normal(μ, σ)",persona:"The Prom Queen",kind:"cont",

        pdf:function(x,p){return normPdf(x,p.mu,p.sd)},cdf:function(x,p){return normCdf((x-p.mu)/p.sd)},
        mean:function(p){return p.mu},sd:function(p){return p.sd},median:function(p){return p.mu},

        if(S.q==="below")return{txt:"P(X ≤ "+fmt(b,2)+")",v:F.cdf(b,p),lo:null,hi:b};
        if(S.q==="above")return{txt:"P(X ≥ "+fmt(a,2)+")",v:1-F.cdf(a,p)+(F.kind==="disc"?F.pmf(a,p):0),lo:a,hi:null};

      function draw(q,p){
        var F=curFam(),cv=$("#pd-cv"),f=fitCanvas(cv),ctx=f.ctx,W=f.W,H=f.H;

          for(i=0;i<=K;i++){var v=F.pmf(i,p);vals.push(v);if(v>maxP)maxP=v}
          maxP*=1.15;

          ctx.strokeStyle=grid;for(var g=0;g<=4;g++){var gy=maxP*g/4,y3=Y2(gy);ctx.beginPath();ctx.moveTo(padL,y3);ctx.lineTo(padL+pw,y3);ctx.stroke();ctx.textAlign="right";ctx.fillText(fmt(gy,2),padL-6,y3+4)}
          var bw=pw/(K+1);
          vals.forEach(function(v,k){
            var inside=(q.lo===null||k>=q.lo)&&(q.hi===null||k<=q.hi);
            ctx.fillStyle=inside?acc:axis;ctx.globalAlpha=inside?1:0.35;
            ctx.fillRect(X(k)-bw*0.32,Y2(v),bw*0.64,ph-(Y2(v)-padT));
            ctx.globalAlpha=1;ctx.fillStyle=axis;ctx.textAlign="center";if(K<=30||k%2===0)ctx.fillText(k,X(k),H-16);
          });
          ctx.fillText("x — number of events / successes →",padL+pw/2,H-2);

        }else{
          var N=220,maxD=0,dens=[];
          for(i=0;i<=N;i++){x=x0+(x1-x0)*i/N;var d=F.pdf(x,p);dens.push([x,d]);if(d>maxD)maxD=d}
          maxD*=1.12||1;
          function Y(d){return padT+ph-ph*d/maxD}
          ctx.strokeStyle=grid;for(var g2=0;g2<=4;g2++){var gy2=maxD*g2/4,y4=Y(gy2);ctx.beginPath();ctx.moveTo(padL,y4);ctx.lineTo(padL+pw,y4);ctx.stroke();ctx.textAlign="right";ctx.fillText(fmt(gy2,2),padL-6,y4+4)}

            for(i=0;i<=N;i++){x=x0+(x1-x0)*i/N;if(x<lo||x>hi)continue;ctx.lineTo(X(x),Y(F.pdf(x,p)))}
            ctx.lineTo(X(hi),Y(0));ctx.closePath();ctx.fillStyle=amb;ctx.globalAlpha=.4;ctx.fill();ctx.globalAlpha=1}
          ctx.strokeStyle=acc;ctx.lineWidth=2;ctx.beginPath();
          dens.forEach(function(pr,i2){if(i2===0)ctx.moveTo(X(pr[0]),Y(pr[1]));else ctx.lineTo(X(pr[0]),Y(pr[1]))});ctx.stroke();ctx.lineWidth=1;
          ctx.fillStyle=axis;ctx.textAlign="center";
          for(var gx=0;gx<=4;gx++){var xv=x0+(x1-x0)*gx/4;ctx.fillText(fmt(xv,Math.abs(xv%1)>1e-9?1:0),X(xv),H-16)}
          ctx.fillText("x →",padL+pw/2,H-2);
          var mn=F.mean(p);ctx.strokeStyle=cssVar("--red");ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(X(mn),padT);ctx.lineTo(X(mn),padT+ph);ctx.stroke();ctx.setLineDash([]);
          ctx.fillStyle=cssVar("--red");ctx.textAlign="left";ctx.fillText("mean",X(mn)+4,padT+11);
          cv.setAttribute("aria-label","Density chart for "+F.label+". Mean "+fmt(F.mean(p),2)+", standard deviation "+fmt(F.sd(p),2)+". The queried probability is "+fmt(q.v,4)+".");
        }
      }

    function regSample(n,seed){
      var rnd=mulberry32(seed>>>0),pts=[];
      function gauss(){var u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
      for(var i=0;i<n;i++){var pt=15+60*rnd();pts.push({x:pt,y:10+0.9*pt+11*gauss()})}
      return pts;
    }

      function axes(ctx,W,H,x0,x1,y0,y1){

        var padL=48,padR=14,padT=12,padB=32,pw=W-padL-padR,ph=H-padT-padB;
        ctx.font="11px ui-monospace,monospace";ctx.fillStyle=axis;ctx.strokeStyle=grid;ctx.lineWidth=1;

      function drawHist(slopes){

        var lo=Math.min.apply(null,slopes),hi=Math.max.apply(null,slopes);
        lo=Math.min(lo,0.9)-0.05;hi=Math.max(hi,0.9)+0.05;
        var bins=18,counts=[],i;for(i=0;i<bins;i++)counts.push(0);
